<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Danh mục sản phẩm - Grocery Store')}"></head>
<body>
<header th:replace="~{shared/fragments/header :: header}"></header>

<main class="category-page">
    <div class="container">
        <!-- Breadcrumbs -->
        <ul class="breadcrumbs" style="margin-top: 20px;">
            <li>
                <a th:href="@{/}" class="breadcrumbs__link">
                    Trang chủ
                    <img th:src="@{/assets/icon/arrow-right.svg}" alt=""/>
                </a>
            </li>
            <li>
                <a href="#!" class="breadcrumbs__link breadcrumbs__link--current">Danh mục sản phẩm</a>
            </li>
        </ul>
        
        <h1 class="category-title">Danh mục sản phẩm</h1>
        
        <div class="row row-cols-4 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 g-2" id="productList">
            <div class="col" th:each="product : ${products}">
                <article class="product-card">
                    <div class="product-card__img-wrap">
                        <a th:href="@{/product/{id}(id=${product.id})}">
                            <img th:src="${product.imageUrl}" th:alt="${product.name}" class="product-card__thumb"/>
                        </a>
                        <button class="like-btn product-card__like-btn" th:data-product-id="${product.id}">
                            <img th:src="@{/assets/icon/heart.svg}" alt="" class="like-btn__icon icon"/>
                            <img th:src="@{/assets/icon/heart-red.svg}" alt="" class="like-btn__icon--liked"/>
                        </button>
                    </div>
                    <h3 class="product-card__title">
                        <a th:href="@{/product/{id}(id=${product.id})}" th:text="${product.name}">Tên sản phẩm</a>
                    </h3>
                    <p class="product-card__brand" th:text="${product.brandName}">Thương hiệu</p>
                    <div class="product-card__row">
                        <span class="product-card__price product-price-vnd" th:data-price="${product.price}">0đ</span>
                        <img th:src="@{/assets/icon/star.svg}" alt="" class="product-card__star"/>
                        <span class="product-card__score product-rating" th:data-rating="${product.averageRating != null ? product.averageRating : 0}">0</span>
                    </div>
                    <div class="product-card__row">
                        <button class="btn btn--primary js-add-to-cart" 
                                th:data-product-id="${product.id}"
                                th:data-name="${product.name}"
                                th:data-price="${product.price}"
                                th:data-image="${product.imageUrl}">
                            Thêm vào giỏ
                        </button>
                    </div>
                </article>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:href="@{/category(page=${currentPage - 1})}" th:if="${currentPage > 0}" class="pagination__link">« Trước</a>
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/category(page=${i})}" 
                   th:text="${i + 1}" 
                   th:class="${i == currentPage} ? 'pagination__link pagination__link--active' : 'pagination__link'">1</a>
            </span>
            <a th:href="@{/category(page=${currentPage + 1})}" th:if="${currentPage < totalPages - 1}" class="pagination__link">Sau »</a>
        </div>
    </div>
</main>

<footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<script th:src="@{/assets/js/cart-api.js}"></script>
<script th:src="@{/assets/js/wishlist-api.js}"></script>

<script>
    // Format VND
    function formatVND(price) {
        return new Intl.NumberFormat('vi-VN').format(price) + 'đ';
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Format all prices to VND
        document.querySelectorAll('.product-price-vnd').forEach(el => {
            let price = parseFloat(el.getAttribute('data-price')) || 0;
            // Convert USD to VND if price < 10000
            if (price > 0 && price < 10000) {
                price = price * 25000;
            }
            el.textContent = formatVND(price);
        });

        // Format all ratings (round to 1 decimal)
        document.querySelectorAll('.product-rating').forEach(el => {
            let rating = parseFloat(el.getAttribute('data-rating')) || 0;
            el.textContent = Math.round(rating * 10) / 10;
        });

        // Sync wishlist status
        syncWishlistStatus();

        // Bind add to cart buttons
        bindAddToCartButtons();
    });

    async function syncWishlistStatus() {
        try {
            const response = await fetch('/api/wishlist');
            if (response.ok) {
                const wishlistItems = await response.json();
                const wishlistProductIds = wishlistItems.map(item => item.productId);
                
                document.querySelectorAll('.like-btn[data-product-id]').forEach(btn => {
                    const productId = parseInt(btn.getAttribute('data-product-id'));
                    if (wishlistProductIds.includes(productId)) {
                        btn.classList.add('like-btn__liked');
                    }
                });
            }
        } catch (error) {
            console.log('Could not sync wishlist:', error);
        }
    }

    function bindAddToCartButtons() {
        document.querySelectorAll('.js-add-to-cart').forEach(btn => {
            btn.onclick = async function(e) {
                e.preventDefault();
                const productId = parseInt(this.dataset.productId);
                if (window.CartAPI) {
                    try {
                        await window.CartAPI.addToCart(productId, 1);
                    } catch (error) {
                        console.error('Error adding to cart:', error);
                    }
                }
            };
        });
    }
</script>
</body>
</html>
