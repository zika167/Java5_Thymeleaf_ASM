<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Danh Sách Yêu Thích | grocerystore')}"></head>
<body>
<!-- Header -->
<header th:replace="~{shared/fragments/header :: header}"></header>

<!-- MAIN -->
<main class="checkout-page">
    <div class="container">
        <!-- Breadcrumbs -->
        <div class="checkout-container">
            <ul class="breadcrumbs checkout-page__breadcrumbs">
                <li>
                    <a th:href="@{/}" class="breadcrumbs__link">
                        Trang chủ
                        <img th:src="@{/assets/icon/arrow-right.svg}" alt=""/>
                    </a>
                </li>
                <li>
                    <a href="#!" class="breadcrumbs__link breadcrumbs__link--current">Danh sách yêu thích</a>
                </li>
            </ul>
        </div>

        <!-- Wishlist content -->
        <div class="checkout-container">
            <div class="row gy-xl-3">
                <div class="col-12">
                    <div class="cart-info">
                        <h1 class="cart-info__heading">Danh Sách Yêu Thích</h1>
                        <div id="wishlistContainer" class="cart-info__list">
                            <div class="loading-state"><p>Đang tải danh sách yêu thích...</p></div>
                        </div>
                        <div class="cart-info__bottom">
                            <div class="cart-info__row cart-info__row-md--block">
                                <div class="cart-info__continue">
                                    <a th:href="@{/}" class="cart-info__continue-link">
                                        <img class="cart-info__continue-icon icon" th:src="@{/assets/icon/arrow-down-2.svg}" alt=""/>
                                        Tiếp tục mua sắm
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<script th:src="@{/assets/js/wishlist-api.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', loadWishlist);

async function loadWishlist() {
    const container = document.getElementById('wishlistContainer');
    
    try {
        const response = await fetch('/api/wishlist');
        
        if (response.status === 401) {
            container.innerHTML = `
                <div class="empty-state" style="text-align: center; padding: 60px 20px;">
                    <p style="color: #666; margin-bottom: 20px;">Bạn cần đăng nhập để xem danh sách yêu thích</p>
                    <a href="/sign-in" class="btn btn--primary">Đăng nhập</a>
                </div>`;
            return;
        }
        
        if (!response.ok) {
            throw new Error('Lỗi tải dữ liệu');
        }
        
        const wishlistItems = await response.json();
        
        if (!wishlistItems || wishlistItems.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="text-align: center; padding: 60px 20px;">
                    <p style="color: #666; margin-bottom: 20px;">Bạn chưa có sản phẩm yêu thích nào</p>
                    <a href="/category" class="btn btn--primary">Khám phá sản phẩm</a>
                </div>`;
            return;
        }
        
        container.innerHTML = wishlistItems.map(item => `
            <article class="cart-item" data-product-id="${item.productId}">
                <a href="/product/${item.productId}">
                    <img src="${item.productImageUrl || '/assets/img/product/default.jpg'}" alt="${item.productName}" class="cart-item__thumb"/>
                </a>
                <div class="cart-item__content">
                    <div class="cart-item__content-left">
                        <h3 class="cart-item__title">
                            <a href="/product/${item.productId}">${item.productName}</a>
                        </h3>
                        <p class="cart-item__price-wrap">
                            ${formatPrice(item.productPrice)} |
                            <span class="cart-item__status">${item.productStock > 0 ? 'Còn hàng' : 'Hết hàng'}</span>
                        </p>
                        <div class="cart-item__ctrl-wrap">
                            <div class="cart-item__ctrl">
                                <button onclick="addToCart(${item.productId})" class="cart-item__ctrl-btn">
                                    <img src="/assets/icon/bag.svg" alt=""/>
                                    Thêm vào giỏ
                                </button>
                                <button onclick="removeFromWishlist(${item.productId})" class="cart-item__ctrl-btn">
                                    <img src="/assets/icon/trash.svg" alt=""/>
                                    Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="cart-item__content-right">
                        <p class="cart-item__total-price">${formatPrice(item.productPrice)}</p>
                    </div>
                </div>
            </article>
        `).join('');
        
    } catch (error) {
        console.error('Error loading wishlist:', error);
        container.innerHTML = '<p style="text-align: center; padding: 40px; color: #dc3545;">Lỗi tải danh sách yêu thích</p>';
    }
}

function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price || 0);
}

async function removeFromWishlist(productId) {
    if (!confirm('Bạn có chắc muốn xóa sản phẩm này khỏi danh sách yêu thích?')) return;
    
    try {
        // Get CSRF token
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
        
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }
        
        const response = await fetch(`/api/wishlist/products/${productId}`, { 
            method: 'DELETE',
            headers: headers
        });
        if (response.ok) {
            await loadWishlist();
            showToast('Đã xóa khỏi danh sách yêu thích');
        }
    } catch (error) {
        console.error('Error removing from wishlist:', error);
        showToast('Có lỗi xảy ra', 'error');
    }
}

async function addToCart(productId) {
    try {
        // Get CSRF token
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
        
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }
        
        const response = await fetch('/api/cart/add', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ productId: productId, quantity: 1 })
        });
        
        if (response.ok) {
            const cartData = await response.json();
            showToast('Đã thêm vào giỏ hàng');
            // Update cart badge and dropdown
            if (window.CartUI) {
                window.CartUI.updateBadge();
                window.CartUI.loadDropdown();
            }
        } else {
            const errorText = await response.text();
            console.error('Add to cart error:', errorText);
            showToast('Có lỗi xảy ra', 'error');
        }
    } catch (error) {
        console.error('Error adding to cart:', error);
        showToast('Có lỗi xảy ra', 'error');
    }
}

function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed; bottom: 20px; right: 20px;
        background: ${type === 'error' ? '#dc3545' : '#28a745'};
        color: white; padding: 15px 20px; border-radius: 8px;
        z-index: 9999; animation: slideIn 0.3s ease;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
