<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Địa Chỉ Giao Hàng | grocerystore')}"></head>
<body>
<th:block th:replace="~{shared/fragments/header :: header}"></th:block>

<main class="profile">
    <div class="container">
        <div class="profile-container">
            <div class="row gy-md-3">
                <div class="col-12 col-md-3">
                    <aside class="profile__sidebar">
                        <div class="profile-user">
                            <img th:src="${session.user != null ? session.user.avatarUrlOrGravatar : 'https://www.gravatar.com/avatar/?d=mp&s=200'}" 
                                 alt="" class="profile-user__avatar" id="user-avatar"/>
                            <h1 class="profile-user__name" th:text="${session.user != null ? session.user.fullName : 'Guest'}">John Smith</h1>
                            <p class="profile-user__desc" th:text="${session.user != null ? '@' + session.user.username : ''}">@johnsmith</p>
                        </div>
                        <div class="profile-menu">
                            <h3 class="profile-menu__title">Quản lý tài khoản</h3>
                            <ul class="profile-menu__list">
                                <li><a th:href="@{/profile}" class="profile-menu__link">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/profile.svg}" alt=""
                                                                          class="icon"/></span>
                                    Thông tin cá nhân</a></li>
                                <li><a th:href="@{/my-orders}" class="profile-menu__link">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/bag.svg}" alt=""
                                                                          class="icon"/></span>
                                    Đơn hàng của tôi</a></li>
                                <li><a th:href="@{/favourite}" class="profile-menu__link">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/heart.svg}" alt=""
                                                                          class="icon"/></span>
                                    Danh sách yêu thích</a></li>
                                <li><a th:href="@{/addresses}" class="profile-menu__link profile-menu__link--active">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/location.svg}" alt=""
                                                                          class="icon"/></span>
                                    Địa chỉ giao hàng</a></li>
                            </ul>
                        </div>
                    </aside>
                </div>

                <div class="col-12 col-md-9">
                    <div class="cart-info">
                        <div class="cart-info__top">
                            <h1 class="cart-info__heading">Địa Chỉ Giao Hàng</h1>
                            <button type="button" onclick="showAddAddressModal()" class="btn btn--primary">+ Thêm địa chỉ mới</button>
                        </div>

                        <div id="addressesList" class="addresses-grid">
                            <div class="loading-state"><p>Đang tải địa chỉ...</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Add/Edit Address Modal -->
<div id="addressModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Địa chỉ mới</h2>
            <button type="button" onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <form id="addressForm" onsubmit="saveAddress(event)">
            <input type="hidden" id="addressId"/>
            
            <!-- Row 1: Name and Phone -->
            <div class="form-row">
                <div class="form-group form-group--half">
                    <input type="text" id="fullName" required class="form-control" placeholder="Họ và tên"/>
                </div>
                <div class="form-group form-group--half">
                    <input type="tel" id="phone" required class="form-control" 
                           pattern="[0-9]{10,11}" 
                           title="Số điện thoại phải từ 10-11 chữ số"
                           placeholder="Số điện thoại"/>
                </div>
            </div>
            
            <!-- Row 2: Location Dropdown -->
            <div class="form-group">
                <select id="city" required class="form-control">
                    <option value="">Tỉnh/ Thành phố, Quận/Huyện, Phường/Xã</option>
                    <option value="Hồ Chí Minh">Hồ Chí Minh</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="Đà Nẵng">Đà Nẵng</option>
                    <option value="Bình Dương">Bình Dương</option>
                    <option value="Đồng Nai">Đồng Nai</option>
                    <option value="Cần Thơ">Cần Thơ</option>
                    <option value="Hải Phòng">Hải Phòng</option>
                    <option value="Bình Định">Bình Định</option>
                    <option value="Khánh Hòa">Khánh Hòa</option>
                    <option value="Long An">Long An</option>
                </select>
            </div>
            
            <!-- Row 3: Detailed Address -->
            <div class="form-group">
                <textarea id="addressLine" required class="form-control" rows="3" placeholder="Địa chỉ cụ thể"></textarea>
            </div>
            
            <!-- Row 4: Address Type -->
            <div class="form-group">
                <label class="form-label">Loại địa chỉ:</label>
                <div class="address-type-group">
                    <label class="address-type-btn">
                        <input type="radio" name="addressType" value="home" checked/>
                        <span>Nhà Riêng</span>
                    </label>
                    <label class="address-type-btn">
                        <input type="radio" name="addressType" value="office"/>
                        <span>Văn Phòng</span>
                    </label>
                </div>
            </div>
            
            <!-- Row 5: Default Checkbox -->
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="isDefault"/>
                    <span>Đặt làm địa chỉ mặc định</span>
                </label>
            </div>
            
            <div class="modal-footer">
                <button type="button" onclick="closeModal()" class="btn btn--outline">Trở Lại</button>
                <button type="submit" class="btn btn--primary btn--orange">Hoàn thành</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{shared/fragments/footer :: footer}"></th:block>
<link rel="stylesheet" th:href="@{/assets/css/addresses.css}"/>
<script th:src="@{/assets/js/address-api.js}"></script>
<script th:src="@{/assets/js/addresses.js}"></script>
</body>
</html>
