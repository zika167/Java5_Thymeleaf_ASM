<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Địa Chỉ Giao Hàng | grocerystore')}"></head>
<body>
<th:block th:replace="~{shared/fragments/header :: header}"></th:block>

<main class="profile">
    <div class="container">
        <div class="profile-container">
            <div class="row gy-md-3">
                <div class="col-12 col-md-3">
                    <aside class="profile__sidebar">
                        <div class="profile-user">
                            <img th:src="${user.avatarUrl != null ? user.avatarUrl : '/assets/img/avatar.jpg'}" 
                                 alt="" class="profile-user__avatar"/>
                            <h1 class="profile-user__name" th:text="${user.fullName != null ? user.fullName : user.username}">Tên người dùng</h1>
                            <p class="profile-user__desc" th:text="'@' + ${user.username}">@username</p>
                        </div>
                        <div class="profile-menu">
                            <h3 class="profile-menu__title">Quản lý tài khoản</h3>
                            <ul class="profile-menu__list">
                                <li><a th:href="@{/profile}" class="profile-menu__link">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/profile.svg}" alt="" class="icon"/></span>
                                    Thông tin cá nhân</a></li>
                                <li><a th:href="@{/my-orders}" class="profile-menu__link">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/bag.svg}" alt="" class="icon"/></span>
                                    Đơn hàng của tôi</a></li>
                                <li><a th:href="@{/favourite}" class="profile-menu__link">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/heart.svg}" alt="" class="icon"/></span>
                                    Danh sách yêu thích</a></li>
                                <li><a th:href="@{/addresses}" class="profile-menu__link profile-menu__link--active">
                                    <span class="profile-menu__icon"><img th:src="@{/assets/icon/location.svg}" alt="" class="icon"/></span>
                                    Địa chỉ giao hàng</a></li>
                            </ul>
                        </div>
                    </aside>
                </div>

                <div class="col-12 col-md-9">
                    <div class="cart-info">
                        <div class="cart-info__top">
                            <h1 class="cart-info__heading">Địa Chỉ Giao Hàng</h1>
                            <button type="button" onclick="showAddAddressModal()" class="btn btn--primary">
                                <img th:src="@{/assets/icon/plus.svg}" alt="" class="icon" style="width: 14px; height: 14px; margin-right: 6px; filter: brightness(0) invert(1);"/>
                                Thêm địa chỉ mới
                            </button>
                        </div>

                        <div id="addressesList" class="addresses-grid">
                            <div class="loading-state"><p>Đang tải địa chỉ...</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Add/Edit Address Modal -->
<div id="addressModal" class="modal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Thêm địa chỉ mới</h2>
            <button type="button" onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <form id="addressForm" onsubmit="saveAddress(event)">
            <input type="hidden" id="addressId"/>
            
            <div class="modal-body">
                <!-- Thông tin liên hệ -->
                <div class="form-section">
                    <h3 class="form-section__title">Thông tin liên hệ</h3>
                    <div class="form-row">
                        <div class="form-group form-group--half">
                            <label class="form-label">Họ và tên <span class="required">*</span></label>
                            <input type="text" id="fullName" required class="form-control" placeholder="Nhập họ và tên"/>
                        </div>
                        <div class="form-group form-group--half">
                            <label class="form-label">Số điện thoại <span class="required">*</span></label>
                            <input type="tel" id="phone" required class="form-control" 
                                   pattern="[0-9]{10,11}" 
                                   title="Số điện thoại phải từ 10-11 chữ số"
                                   placeholder="Nhập số điện thoại"/>
                        </div>
                    </div>
                </div>

                <!-- Địa chỉ -->
                <div class="form-section">
                    <h3 class="form-section__title">Địa chỉ</h3>
                    
                    <div class="form-row">
                        <div class="form-group form-group--third">
                            <label class="form-label">Tỉnh/Thành phố <span class="required">*</span></label>
                            <select id="province" required class="form-control" onchange="loadDistricts()">
                                <option value="">Chọn Tỉnh/Thành phố</option>
                            </select>
                        </div>
                        <div class="form-group form-group--third">
                            <label class="form-label">Quận/Huyện <span class="required">*</span></label>
                            <select id="district" required class="form-control" onchange="loadWards()" disabled>
                                <option value="">Chọn Quận/Huyện</option>
                            </select>
                        </div>
                        <div class="form-group form-group--third">
                            <label class="form-label">Phường/Xã <span class="required">*</span></label>
                            <select id="ward" required class="form-control" disabled>
                                <option value="">Chọn Phường/Xã</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Địa chỉ cụ thể <span class="required">*</span></label>
                        <textarea id="addressLine" required class="form-control" rows="2" 
                                  placeholder="Số nhà, tên đường, tòa nhà..."></textarea>
                    </div>
                </div>

                <!-- Cài đặt -->
                <div class="form-section">
                    <h3 class="form-section__title">Cài đặt</h3>
                    
                    <div class="form-group">
                        <label class="form-label">Loại địa chỉ</label>
                        <div class="address-type-group">
                            <label class="address-type-btn">
                                <input type="radio" name="addressType" value="home" checked/>
                                <span class="address-type-icon">🏠</span>
                                <span>Nhà riêng</span>
                            </label>
                            <label class="address-type-btn">
                                <input type="radio" name="addressType" value="office"/>
                                <span class="address-type-icon">🏢</span>
                                <span>Văn phòng</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isDefault"/>
                            <span class="checkbox-custom"></span>
                            <span>Đặt làm địa chỉ mặc định</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button type="button" onclick="closeModal()" class="btn btn--outline">Hủy</button>
                <button type="submit" class="btn btn--primary">Lưu địa chỉ</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{shared/fragments/footer :: footer}"></th:block>
<link rel="stylesheet" th:href="@{/assets/css/addresses.css}"/>
<script th:src="@{/assets/js/address-api.js}"></script>
<script th:src="@{/assets/js/addresses.js}"></script>

<script>
// Vietnam Provinces API
const VN_API_BASE = 'https://provinces.open-api.vn/api';
let provincesData = [];
let districtsData = [];
let wardsData = [];

// Load provinces on page load
document.addEventListener('DOMContentLoaded', function() {
    loadProvinces();
});

async function loadProvinces() {
    try {
        const response = await fetch(`${VN_API_BASE}/p/`);
        provincesData = await response.json();
        
        const provinceSelect = document.getElementById('province');
        provinceSelect.innerHTML = '<option value="">Chọn Tỉnh/Thành phố</option>';
        
        provincesData.forEach(province => {
            const option = document.createElement('option');
            option.value = province.code;
            option.textContent = province.name;
            option.dataset.name = province.name;
            provinceSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading provinces:', error);
        // Fallback to static list
        loadStaticProvinces();
    }
}

function loadStaticProvinces() {
    const provinces = [
        'Hà Nội', 'Hồ Chí Minh', 'Đà Nẵng', 'Hải Phòng', 'Cần Thơ',
        'An Giang', 'Bà Rịa - Vũng Tàu', 'Bắc Giang', 'Bắc Kạn', 'Bạc Liêu',
        'Bắc Ninh', 'Bến Tre', 'Bình Định', 'Bình Dương', 'Bình Phước',
        'Bình Thuận', 'Cà Mau', 'Cao Bằng', 'Đắk Lắk', 'Đắk Nông',
        'Điện Biên', 'Đồng Nai', 'Đồng Tháp', 'Gia Lai', 'Hà Giang',
        'Hà Nam', 'Hà Tĩnh', 'Hải Dương', 'Hậu Giang', 'Hòa Bình',
        'Hưng Yên', 'Khánh Hòa', 'Kiên Giang', 'Kon Tum', 'Lai Châu',
        'Lâm Đồng', 'Lạng Sơn', 'Lào Cai', 'Long An', 'Nam Định',
        'Nghệ An', 'Ninh Bình', 'Ninh Thuận', 'Phú Thọ', 'Phú Yên',
        'Quảng Bình', 'Quảng Nam', 'Quảng Ngãi', 'Quảng Ninh', 'Quảng Trị',
        'Sóc Trăng', 'Sơn La', 'Tây Ninh', 'Thái Bình', 'Thái Nguyên',
        'Thanh Hóa', 'Thừa Thiên Huế', 'Tiền Giang', 'Trà Vinh', 'Tuyên Quang',
        'Vĩnh Long', 'Vĩnh Phúc', 'Yên Bái'
    ];
    
    const provinceSelect = document.getElementById('province');
    provinceSelect.innerHTML = '<option value="">Chọn Tỉnh/Thành phố</option>';
    
    provinces.forEach(province => {
        const option = document.createElement('option');
        option.value = province;
        option.textContent = province;
        option.dataset.name = province;
        provinceSelect.appendChild(option);
    });
}

async function loadDistricts() {
    const provinceSelect = document.getElementById('province');
    const districtSelect = document.getElementById('district');
    const wardSelect = document.getElementById('ward');
    
    const provinceCode = provinceSelect.value;
    
    // Reset district and ward
    districtSelect.innerHTML = '<option value="">Chọn Quận/Huyện</option>';
    districtSelect.disabled = true;
    wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
    wardSelect.disabled = true;
    
    if (!provinceCode) return;
    
    try {
        const response = await fetch(`${VN_API_BASE}/p/${provinceCode}?depth=2`);
        const data = await response.json();
        districtsData = data.districts || [];
        
        districtSelect.disabled = false;
        districtsData.forEach(district => {
            const option = document.createElement('option');
            option.value = district.code;
            option.textContent = district.name;
            option.dataset.name = district.name;
            districtSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading districts:', error);
        districtSelect.disabled = false;
    }
}

async function loadWards() {
    const districtSelect = document.getElementById('district');
    const wardSelect = document.getElementById('ward');
    
    const districtCode = districtSelect.value;
    
    // Reset ward
    wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
    wardSelect.disabled = true;
    
    if (!districtCode) return;
    
    try {
        const response = await fetch(`${VN_API_BASE}/d/${districtCode}?depth=2`);
        const data = await response.json();
        wardsData = data.wards || [];
        
        wardSelect.disabled = false;
        wardsData.forEach(ward => {
            const option = document.createElement('option');
            option.value = ward.code;
            option.textContent = ward.name;
            option.dataset.name = ward.name;
            wardSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading wards:', error);
        wardSelect.disabled = false;
    }
}

// Get selected location names
function getSelectedLocationNames() {
    const province = document.getElementById('province');
    const district = document.getElementById('district');
    const ward = document.getElementById('ward');
    
    return {
        province: province.options[province.selectedIndex]?.dataset?.name || province.value,
        district: district.options[district.selectedIndex]?.dataset?.name || district.value,
        ward: ward.options[ward.selectedIndex]?.dataset?.name || ward.value
    };
}

// Override saveAddress to include location names
window.saveAddress = async function(event) {
    event.preventDefault();
    
    const locations = getSelectedLocationNames();
    const addressId = document.getElementById('addressId').value;
    const fullName = document.getElementById('fullName').value;
    const phone = document.getElementById('phone').value;
    const addressLine = document.getElementById('addressLine').value;
    const addressType = document.querySelector('input[name="addressType"]:checked').value;
    const isDefault = document.getElementById('isDefault').checked;
    
    // Combine full address for city field
    const city = `${locations.ward}, ${locations.district}, ${locations.province}`;
    
    const addressData = {
        recipientName: fullName,
        phone: phone,
        addressLine1: addressLine,
        city: city,
        isDefault: isDefault
    };
    
    console.log('Sending address data:', addressData);
    
    try {
        let response;
        if (addressId) {
            response = await fetch(`/api/addresses/${addressId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(addressData)
            });
        } else {
            response = await fetch('/api/addresses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(addressData)
            });
        }
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('Server error:', errorText);
            throw new Error('Failed to save address');
        }
        
        closeModal();
        loadAddresses();
        alert(addressId ? 'Cập nhật địa chỉ thành công!' : 'Thêm địa chỉ thành công!');
    } catch (error) {
        console.error('Error saving address:', error);
        alert('Có lỗi xảy ra khi lưu địa chỉ');
    }
};

// Reset form when opening modal
const originalShowAddAddressModal = window.showAddAddressModal;
window.showAddAddressModal = function() {
    document.getElementById('addressForm').reset();
    document.getElementById('addressId').value = '';
    document.getElementById('modalTitle').textContent = 'Thêm địa chỉ mới';
    document.getElementById('district').disabled = true;
    document.getElementById('ward').disabled = true;
    document.getElementById('district').innerHTML = '<option value="">Chọn Quận/Huyện</option>';
    document.getElementById('ward').innerHTML = '<option value="">Chọn Phường/Xã</option>';
    document.getElementById('addressModal').classList.add('show');
};

// Override editAddress to handle new form structure
window.editAddress = async function(id) {
    try {
        const address = await AddressAPI.getAddress(id);
        if (!address) {
            alert('Không thể tải địa chỉ');
            return;
        }

        document.getElementById('modalTitle').textContent = 'Chỉnh sửa địa chỉ';
        document.getElementById('addressId').value = address.id;
        document.getElementById('fullName').value = address.recipientName || '';
        document.getElementById('phone').value = address.phone || '';
        document.getElementById('addressLine').value = address.addressLine1 || '';
        document.getElementById('isDefault').checked = address.isDefault || false;
        
        // Parse city field (format: "Phường/Xã, Quận/Huyện, Tỉnh/Thành phố")
        const cityParts = (address.city || '').split(', ');
        
        // Reset dropdowns
        document.getElementById('district').innerHTML = '<option value="">Chọn Quận/Huyện</option>';
        document.getElementById('district').disabled = true;
        document.getElementById('ward').innerHTML = '<option value="">Chọn Phường/Xã</option>';
        document.getElementById('ward').disabled = true;
        
        // Try to match province
        if (cityParts.length >= 1) {
            const provinceName = cityParts[cityParts.length - 1]; // Last part is province
            const provinceSelect = document.getElementById('province');
            
            // Find and select province by name
            for (let i = 0; i < provinceSelect.options.length; i++) {
                if (provinceSelect.options[i].dataset.name === provinceName || 
                    provinceSelect.options[i].textContent === provinceName) {
                    provinceSelect.selectedIndex = i;
                    
                    // Load districts for this province
                    if (provinceSelect.value) {
                        await loadDistricts();
                        
                        // Try to match district
                        if (cityParts.length >= 2) {
                            const districtName = cityParts[cityParts.length - 2];
                            const districtSelect = document.getElementById('district');
                            
                            for (let j = 0; j < districtSelect.options.length; j++) {
                                if (districtSelect.options[j].dataset.name === districtName ||
                                    districtSelect.options[j].textContent === districtName) {
                                    districtSelect.selectedIndex = j;
                                    
                                    // Load wards for this district
                                    if (districtSelect.value) {
                                        await loadWards();
                                        
                                        // Try to match ward
                                        if (cityParts.length >= 3) {
                                            const wardName = cityParts[0]; // First part is ward
                                            const wardSelect = document.getElementById('ward');
                                            
                                            for (let k = 0; k < wardSelect.options.length; k++) {
                                                if (wardSelect.options[k].dataset.name === wardName ||
                                                    wardSelect.options[k].textContent === wardName) {
                                                    wardSelect.selectedIndex = k;
                                                    break;
                                                }
                                            }
                                        }
                                    }
                                    break;
                                }
                            }
                        }
                    }
                    break;
                }
            }
        }
        
        document.getElementById('addressModal').classList.add('show');
    } catch (error) {
        console.error('Error loading address:', error);
        alert('Có lỗi xảy ra khi tải địa chỉ');
    }
};
</script>
</body>
</html>
