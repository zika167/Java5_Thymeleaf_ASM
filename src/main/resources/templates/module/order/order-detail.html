<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Chi Tiết Đơn Hàng | grocerystore')}"></head>
<body>
<th:block th:replace="~{shared/fragments/header :: header}"></th:block>

<main class="profile">
    <div class="container">
        <div class="profile-container">
            <div class="row gy-md-3">
                <!-- Sidebar -->
                <div class="col-3 col-xl-4 col-lg-5 col-md-12">
                    <aside class="profile__sidebar">
                        <div class="profile-user">
                            <img th:src="${user != null && user.avatarUrl != null ? user.avatarUrl : '/assets/img/avatar/default-avatar.png'}" 
                                 alt="" class="profile-user__avatar"/>
                            <h1 class="profile-user__name" th:text="${user != null ? user.fullName : 'Guest'}">Tên người dùng</h1>
                            <p class="profile-user__desc" th:text="${user != null ? '@' + user.username : ''}">@username</p>
                        </div>
                        <div class="profile-menu">
                            <h3 class="profile-menu__title">Quản lý tài khoản</h3>
                            <ul class="profile-menu__list">
                                <li>
                                    <a th:href="@{/profile}" class="profile-menu__link">
                                        <span class="profile-menu__icon"><img th:src="@{/assets/icon/profile.svg}" alt="" class="icon"/></span>
                                        Thông tin cá nhân
                                    </a>
                                </li>
                                <li>
                                    <a th:href="@{/my-orders}" class="profile-menu__link profile-menu__link--active">
                                        <span class="profile-menu__icon"><img th:src="@{/assets/icon/bag.svg}" alt="" class="icon"/></span>
                                        Đơn hàng của tôi
                                    </a>
                                </li>
                                <li>
                                    <a th:href="@{/favourite}" class="profile-menu__link">
                                        <span class="profile-menu__icon"><img th:src="@{/assets/icon/heart.svg}" alt="" class="icon"/></span>
                                        Danh sách yêu thích
                                    </a>
                                </li>
                                <li>
                                    <a th:href="@{/addresses}" class="profile-menu__link">
                                        <span class="profile-menu__icon"><img th:src="@{/assets/icon/location.svg}" alt="" class="icon"/></span>
                                        Địa chỉ giao hàng
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </aside>
                </div>

                <!-- Main Content -->
                <div class="col-9 col-xl-8 col-lg-7 col-md-12">
                    <div class="order-detail">
                        <!-- Header -->
                        <div class="order-detail__header">
                            <a th:href="@{/my-orders}" class="order-detail__back">
                                <img th:src="@{/assets/icon/arrow-left.svg}" alt="" class="icon"/>
                                <span>Quay lại</span>
                            </a>
                            <div class="order-detail__title">
                                <h1 id="orderNumber">Chi Tiết Đơn Hàng</h1>
                                <p id="orderDate" class="order-detail__date"></p>
                            </div>
                        </div>

                        <!-- Loading State -->
                        <div id="loadingState" class="order-detail__loading">
                            <div class="loading-spinner"></div>
                            <p>Đang tải thông tin đơn hàng...</p>
                        </div>

                        <!-- Order Content -->
                        <div id="orderContent" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{shared/fragments/footer :: footer}"></th:block>
<th:block th:replace="~{shared/fragments/notification-modal :: notification-modal}"></th:block>
<link rel="stylesheet" th:href="@{/assets/css/profile.css}"/>
<script th:src="@{/assets/js/notification-modal.js}"></script>
<script th:src="@{/assets/js/cart-api.js}"></script>

<script th:inline="javascript">
    const orderId = /*[[${orderId}]]*/ 0;
    let currentOrder = null;

    document.addEventListener('DOMContentLoaded', () => loadOrderDetail());

    async function loadOrderDetail() {
        try {
            const response = await fetch(`/api/orders/${orderId}`);
            if (!response.ok) throw new Error('Failed to load order');
            currentOrder = await response.json();
            
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('orderNumber').textContent = `Đơn hàng #${currentOrder.orderNumber}`;
            document.getElementById('orderDate').textContent = `Đặt ngày ${formatDate(currentOrder.orderedAt)}`;
            
            renderOrderContent(currentOrder);
        } catch (error) {
            console.error(error);
            document.getElementById('loadingState').innerHTML = `
                <div class="error-state">
                    <p>❌ Không thể tải thông tin đơn hàng</p>
                    <a href="/my-orders" class="btn btn--primary">Quay lại danh sách</a>
                </div>
            `;
        }
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        return new Date(dateStr).toLocaleDateString('vi-VN', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    }

    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    function renderOrderContent(order) {
        const container = document.getElementById('orderContent');
        const statusConfig = {
            'PENDING': { class: 'warning', text: 'Chờ xác nhận', icon: '⏳', step: 1 },
            'CONFIRMED': { class: 'info', text: 'Đã xác nhận', icon: '✓', step: 2 },
            'PROCESSING': { class: 'info', text: 'Đang xử lý', icon: '⚙️', step: 2 },
            'SHIPPED': { class: 'primary', text: 'Đang giao hàng', icon: '🚚', step: 3 },
            'DELIVERED': { class: 'success', text: 'Đã giao hàng', icon: '📦', step: 4 },
            'CANCELLED': { class: 'danger', text: 'Đã hủy', icon: '✕', step: 0 }
        };
        const status = statusConfig[order.status] || { class: '', text: 'Không xác định', icon: '?', step: 0 };

        container.innerHTML = `
            <!-- Status Card -->
            <div class="status-card status-card--${status.class}">
                <div class="status-card__header">
                    <div class="status-card__badge">
                        <span class="status-card__icon">${status.icon}</span>
                        <span class="status-card__text">${status.text}</span>
                    </div>
                    ${order.status === 'PENDING' ? `
                        <button onclick="cancelOrder()" class="btn btn--outline-danger btn--small">Hủy đơn hàng</button>
                    ` : ''}
                    ${order.status === 'DELIVERED' ? `
                        <button onclick="reorderItems()" class="btn btn--primary btn--small">🛒 Mua lại</button>
                    ` : ''}
                </div>
                
                ${order.status !== 'CANCELLED' ? `
                <div class="status-timeline">
                    <div class="timeline-track">
                        <div class="timeline-progress" style="width: ${(status.step / 4) * 100}%"></div>
                    </div>
                    <div class="timeline-steps">
                        <div class="timeline-step ${status.step >= 1 ? 'active' : ''}">
                            <div class="timeline-step__dot">📝</div>
                            <div class="timeline-step__label">Đã đặt</div>
                            <div class="timeline-step__time">${order.orderedAt ? formatShortDate(order.orderedAt) : ''}</div>
                        </div>
                        <div class="timeline-step ${status.step >= 2 ? 'active' : ''}">
                            <div class="timeline-step__dot">✅</div>
                            <div class="timeline-step__label">Xác nhận</div>
                            <div class="timeline-step__time">${order.confirmedAt ? formatShortDate(order.confirmedAt) : ''}</div>
                        </div>
                        <div class="timeline-step ${status.step >= 3 ? 'active' : ''}">
                            <div class="timeline-step__dot">🚚</div>
                            <div class="timeline-step__label">Đang giao</div>
                            <div class="timeline-step__time">${order.shippedAt ? formatShortDate(order.shippedAt) : ''}</div>
                        </div>
                        <div class="timeline-step ${status.step >= 4 ? 'active' : ''}">
                            <div class="timeline-step__dot">📦</div>
                            <div class="timeline-step__label">Hoàn thành</div>
                            <div class="timeline-step__time">${order.deliveredAt ? formatShortDate(order.deliveredAt) : ''}</div>
                        </div>
                    </div>
                </div>
                ` : `
                <div class="cancelled-notice">
                    <p>Đơn hàng đã bị hủy. Nếu bạn đã thanh toán, tiền sẽ được hoàn lại trong 3-5 ngày làm việc.</p>
                </div>
                `}
            </div>

            <!-- Info Cards Grid -->
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-card__icon">📍</div>
                    <div class="info-card__content">
                        <h3>Địa chỉ giao hàng</h3>
                        <p class="info-card__name">${order.shippingName || 'Chưa có thông tin'}</p>
                        <p>${order.shippingPhone || ''}</p>
                        <p>${order.shippingAddress || 'Chưa có địa chỉ'}</p>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-card__icon">💳</div>
                    <div class="info-card__content">
                        <h3>Thanh toán</h3>
                        <p class="info-card__name">${getPaymentMethodText(order.paymentMethod)}</p>
                        <p class="payment-status payment-status--${order.paymentStatus === 'PAID' ? 'paid' : 'pending'}">
                            ${order.paymentStatus === 'PAID' ? '✓ Đã thanh toán' : '○ Chưa thanh toán'}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Products List -->
            <div class="products-card">
                <h3 class="products-card__title">Sản phẩm (${order.orderItems.length})</h3>
                <div class="products-list">
                    ${order.orderItems.map(item => `
                        <div class="product-row">
                            <div class="product-row__image">
                                <img src="${item.productImage || '/assets/img/product/default.jpg'}" alt="${item.productName}"/>
                                <span class="product-row__qty">${item.quantity}</span>
                            </div>
                            <div class="product-row__info">
                                <h4>${item.productName}</h4>
                                <p class="product-row__price">${formatCurrency(item.unitPrice)} × ${item.quantity}</p>
                            </div>
                            <div class="product-row__total">${formatCurrency(item.subtotal)}</div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <!-- Order Summary -->
            <div class="summary-card">
                <div class="summary-row">
                    <span>Tạm tính</span>
                    <span>${formatCurrency(order.subtotal)}</span>
                </div>
                <div class="summary-row">
                    <span>Phí vận chuyển</span>
                    <span>${order.shippingFee > 0 ? formatCurrency(order.shippingFee) : 'Miễn phí'}</span>
                </div>
                <div class="summary-row">
                    <span>Thuế (10%)</span>
                    <span>${formatCurrency(order.tax)}</span>
                </div>
                <div class="summary-row summary-row--total">
                    <span>Tổng cộng</span>
                    <span>${formatCurrency(order.totalAmount)}</span>
                </div>
            </div>

            ${order.customerNote ? `
            <div class="note-card">
                <h4>📝 Ghi chú</h4>
                <p>${order.customerNote}</p>
            </div>
            ` : ''}
        `;
        container.style.display = 'block';
    }

    function formatShortDate(dateStr) {
        if (!dateStr) return '';
        return new Date(dateStr).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function getPaymentMethodText(method) {
        const methods = {
            'COD': 'Thanh toán khi nhận hàng',
            'VNPAY': 'VNPay',
            'MOMO': 'Ví MoMo',
            'BANK_TRANSFER': 'Chuyển khoản ngân hàng'
        };
        return methods[method] || method;
    }

    async function cancelOrder() {
        const confirmed = await NotificationModal.confirm('Bạn có chắc chắn muốn hủy đơn hàng này?', 'Xác nhận hủy đơn');
        if (confirmed) {
            try {
                const response = await fetch(`/api/orders/${orderId}/cancel`, { method: 'PUT' });
                if (!response.ok) throw new Error('Failed to cancel');
                NotificationModal.success('Đã hủy đơn hàng thành công');
                loadOrderDetail();
            } catch (error) {
                NotificationModal.error('Có lỗi xảy ra khi hủy đơn hàng');
            }
        }
    }

    async function reorderItems() {
        if (!currentOrder) return;
        
        try {
            let addedCount = 0;
            for (const item of currentOrder.orderItems) {
                try {
                    const response = await fetch('/api/cart/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ productId: item.productId, quantity: item.quantity })
                    });
                    if (response.ok) addedCount++;
                } catch (e) {}
            }

            // Update cart badge
            if (window.CartAPI && window.CartAPI.getCartItemCount) {
                const count = await window.CartAPI.getCartItemCount();
                document.querySelectorAll('.nav-btn__qnt').forEach(el => el.textContent = count);
            }

            NotificationModal.success(`Đã thêm ${addedCount} sản phẩm vào giỏ hàng`);
        } catch (error) {
            NotificationModal.error('Có lỗi xảy ra');
        }
    }
</script>

<style>
.order-detail { padding: 0; }

.order-detail__header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-color, #eee);
}

.order-detail__back {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-secondary, #f8f9fa);
    border-radius: 8px;
    color: var(--text-color, #333);
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
}
.order-detail__back:hover { background: var(--primary-color, #77dae6); color: #fff; }
.order-detail__back .icon { width: 16px; height: 16px; }

.order-detail__title h1 { font-size: 24px; margin: 0 0 4px; }
.order-detail__date { color: var(--text-muted, #666); font-size: 14px; margin: 0; }

.order-detail__loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-muted, #666);
}
.loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border-color, #eee);
    border-top-color: var(--primary-color, #77dae6);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Status Card */
.status-card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.status-card--warning { border-left: 4px solid #ffc107; }
.status-card--info { border-left: 4px solid #17a2b8; }
.status-card--primary { border-left: 4px solid #77dae6; }
.status-card--success { border-left: 4px solid #28a745; }
.status-card--danger { border-left: 4px solid #dc3545; }

.status-card__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.status-card__badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-secondary, #f8f9fa);
    border-radius: 24px;
    font-weight: 600;
}
.status-card__icon { font-size: 18px; }
.status-card__text { font-size: 14px; }

/* Timeline */
.status-timeline { position: relative; }
.timeline-track {
    height: 4px;
    background: var(--border-color, #e9ecef);
    border-radius: 2px;
    margin-bottom: 16px;
}
.timeline-progress {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-color, #77dae6), #5bc0de);
    border-radius: 2px;
    transition: width 0.5s ease;
}
.timeline-steps {
    display: flex;
    justify-content: space-between;
}
.timeline-step {
    text-align: center;
    flex: 1;
    opacity: 0.4;
    transition: opacity 0.3s;
}
.timeline-step.active { opacity: 1; }
.timeline-step__dot {
    font-size: 24px;
    margin-bottom: 8px;
}
.timeline-step__label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-color, #333);
}
.timeline-step__time {
    font-size: 11px;
    color: var(--text-muted, #666);
    margin-top: 4px;
}

.cancelled-notice {
    background: #fff5f5;
    border-radius: 8px;
    padding: 16px;
    color: #c53030;
    font-size: 14px;
}

/* Info Grid */
.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}
.info-card {
    display: flex;
    gap: 16px;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.info-card__icon {
    font-size: 28px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-secondary, #f8f9fa);
    border-radius: 12px;
    flex-shrink: 0;
}
.info-card__content h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted, #666);
    margin: 0 0 8px;
}
.info-card__content p { margin: 0 0 4px; font-size: 14px; }
.info-card__name { font-weight: 600; font-size: 15px !important; }

.payment-status { font-weight: 500; }
.payment-status--paid { color: #28a745; }
.payment-status--pending { color: #ffc107; }

/* Products Card */
.products-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.products-card__title {
    font-size: 16px;
    margin: 0 0 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color, #eee);
}
.products-list { display: flex; flex-direction: column; gap: 12px; }

.product-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px;
    background: var(--bg-secondary, #f8f9fa);
    border-radius: 10px;
    transition: transform 0.2s;
}
.product-row:hover { transform: translateX(4px); }

.product-row__image {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
}
.product-row__image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}
.product-row__qty {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--primary-color, #77dae6);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.product-row__info { flex: 1; min-width: 0; }
.product-row__info h4 {
    font-size: 14px;
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.product-row__price { font-size: 13px; color: var(--text-muted, #666); margin: 0; }
.product-row__total {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary-color, #77dae6);
    white-space: nowrap;
}

/* Summary Card */
.summary-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--border-color, #f0f0f0);
}
.summary-row:last-child { border-bottom: none; }
.summary-row--total {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary-color, #77dae6);
    padding-top: 16px;
    margin-top: 8px;
    border-top: 2px solid var(--border-color, #eee);
    border-bottom: none;
}

/* Note Card */
.note-card {
    background: #fffbeb;
    border-radius: 12px;
    padding: 16px 20px;
    border-left: 4px solid #f59e0b;
}
.note-card h4 { font-size: 14px; margin: 0 0 8px; }
.note-card p { font-size: 14px; margin: 0; color: #92400e; }

/* Buttons */
.btn { 
    padding: 10px 20px; 
    border-radius: 8px; 
    font-size: 14px; 
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
}
.btn--small { padding: 8px 16px; font-size: 13px; }
.btn--primary { background: var(--primary-color, #77dae6); color: #fff; }
.btn--primary:hover { filter: brightness(1.1); }
.btn--outline-danger { 
    background: transparent; 
    border: 1px solid #dc3545; 
    color: #dc3545; 
}
.btn--outline-danger:hover { background: #dc3545; color: #fff; }

/* Responsive */
@media (max-width: 768px) {
    .order-detail__header { flex-direction: column; }
    .status-card__header { flex-direction: column; gap: 12px; align-items: flex-start; }
    .timeline-step__label { font-size: 11px; }
    .timeline-step__time { display: none; }
    .info-grid { grid-template-columns: 1fr; }
}
</style>
</body>
</html>
