<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard | grocerystore</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="admin-body">

<th:block th:replace="~{shared/fragments/admin-sidebar :: admin-sidebar}"></th:block>

<main class="admin-main">
    <div class="admin-header">
        <h1>Dashboard</h1>
        <div class="admin-user">
            <img th:src="${session.user != null ? session.user.avatarUrlOrGravatar : '/assets/img/avatar.jpg'}" 
                 alt="" class="admin-user__avatar"/>
            <span th:text="${session.user != null ? session.user.fullName : 'Admin'}">Admin</span>
        </div>
    </div>

    <div class="admin-content">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card stat-card--blue">
                <div class="stat-card__icon">👥</div>
                <div class="stat-card__content">
                    <h3 id="totalUsers">0</h3>
                    <p>Tổng Users</p>
                </div>
            </div>
            <div class="stat-card stat-card--green">
                <div class="stat-card__icon">🛍️</div>
                <div class="stat-card__content">
                    <h3 id="totalOrders">0</h3>
                    <p>Tổng Orders</p>
                </div>
            </div>
            <div class="stat-card stat-card--orange">
                <div class="stat-card__icon">💰</div>
                <div class="stat-card__content">
                    <h3 id="totalRevenue">0đ</h3>
                    <p>Doanh Thu</p>
                </div>
            </div>
            <div class="stat-card stat-card--purple">
                <div class="stat-card__icon">📦</div>
                <div class="stat-card__content">
                    <h3 id="totalProducts">0</h3>
                    <p>Tổng Products</p>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Đăng Ký Users (7 ngày gần nhất)</h3>
                <canvas id="registrationChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Doanh Thu (7 ngày gần nhất)</h3>
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <!-- Recent Orders -->
        <div class="table-card">
            <h3>Đơn Hàng Gần Đây</h3>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Mã ĐH</th>
                        <th>Khách Hàng</th>
                        <th>Ngày</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                    </thead>
                    <tbody id="recentOrdersTable">
                    <tr>
                        <td colspan="6" class="text-center">Đang tải...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    let registrationChart, revenueChart;

    document.addEventListener('DOMContentLoaded', function () {
        loadDashboardStats();
        loadRegistrationChart();
        loadRevenueChart();
        loadRecentOrders();
    });

    function loadDashboardStats() {
        fetch('/api/admin/statistics/dashboard')
            .then(r => r.json())
            .then(data => {
                document.getElementById('totalUsers').textContent = data.totalUsers || 0;
                document.getElementById('totalOrders').textContent = data.totalOrders || 0;
                document.getElementById('totalRevenue').textContent =
                    new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'}).format(data.totalRevenue || 0);
                document.getElementById('totalProducts').textContent = data.totalProducts || 0;
            })
            .catch(e => console.error('Error loading stats:', e));
    }

    function loadRegistrationChart() {
        fetch('/api/admin/statistics/registrations/last-7-days')
            .then(r => r.json())
            .then(data => {
                const ctx = document.getElementById('registrationChart').getContext('2d');
                if (Array.isArray(data) && data.length > 0) {
                    registrationChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.map(d => new Date(d.date).toLocaleDateString('vi-VN')),
                            datasets: [{
                                label: 'Đăng ký mới',
                                data: data.map(d => d.count),
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                tension: 0.4,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {legend: {display: false}}
                        }
                    });
                } else {
                    // No data - show empty chart
                    registrationChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: getLast7Days(),
                            datasets: [{
                                label: 'Đăng ký mới',
                                data: [0, 0, 0, 0, 0, 0, 0],
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                tension: 0.4,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {legend: {display: false}}
                        }
                    });
                }
            })
            .catch(e => {
                console.error('Error loading registration chart:', e);
            });
    }

    function loadRevenueChart() {
        // Simple revenue chart based on orders
        const ctx = document.getElementById('revenueChart').getContext('2d');
        revenueChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: getLast7Days(),
                datasets: [{
                    label: 'Doanh thu',
                    data: [0, 0, 0, 0, 0, 0, 0],
                    backgroundColor: 'rgba(118, 75, 162, 0.8)',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {legend: {display: false}}
            }
        });
    }

    function getLast7Days() {
        const days = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            days.push(d.toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit'}));
        }
        return days;
    }

    function loadRecentOrders() {
        fetch('/api/orders/paginated?page=0&size=10')
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('recentOrdersTable');
                if (data.content && data.content.length > 0) {
                    tbody.innerHTML = data.content.map(order => `
                        <tr>
                            <td><strong>${order.orderNumber}</strong></td>
                            <td>${order.userName || 'N/A'}</td>
                            <td>${new Date(order.createdAt).toLocaleDateString('vi-VN')}</td>
                            <td>${new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'}).format(order.totalAmount)}</td>
                            <td><span class="badge badge--${order.status.toLowerCase()}">${getStatusText(order.status)}</span></td>
                            <td><a href="/admin/orders?id=${order.id}" class="btn btn--small">Chi tiết</a></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Chưa có đơn hàng</td></tr>';
                }
            })
            .catch(e => {
                console.error('Error loading orders:', e);
                document.getElementById('recentOrdersTable').innerHTML =
                    '<tr><td colspan="6" class="text-center">Lỗi tải dữ liệu</td></tr>';
            });
    }

    function getStatusText(status) {
        const statusMap = {
            'PENDING': 'Chờ xử lý',
            'PROCESSING': 'Đang xử lý',
            'CONFIRMED': 'Đã xác nhận',
            'SHIPPED': 'Đang giao',
            'DELIVERED': 'Đã giao',
            'CANCELLED': 'Đã hủy'
        };
        return statusMap[status] || status;
    }
</script>

</body>
</html>
