<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản Lý Orders | Admin</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}"/>
</head>
<body class="admin-body">

<th:block th:replace="~{shared/fragments/admin-sidebar :: admin-sidebar}"></th:block>

<main class="admin-main">
    <div class="admin-header">
        <h1>Quản Lý Orders</h1>
        <div class="admin-user">
            <img th:src="${session.user != null ? session.user.avatarUrlOrGravatar : '/assets/img/avatar.jpg'}" 
                 alt="" class="admin-user__avatar"/>
            <span th:text="${session.user != null ? session.user.fullName : 'Admin'}">Admin</span>
        </div>
    </div>

    <div class="admin-content">
        <div class="table-card">
            <div class="table-card__header">
                <input type="text" id="searchInput" placeholder="Tìm mã đơn hàng..." class="search-input"/>
                <select id="statusFilter" class="filter-select" onchange="loadOrders()">
                    <option value="">Tất cả trạng thái</option>
                    <option value="PENDING">Chờ xác nhận</option>
                    <option value="CONFIRMED">Đã xác nhận</option>
                    <option value="PROCESSING">Đang xử lý</option>
                    <option value="SHIPPED">Đang giao</option>
                    <option value="DELIVERED">Đã giao</option>
                    <option value="CANCELLED">Đã hủy</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Mã ĐH</th>
                        <th>Khách Hàng</th>
                        <th>Ngày Đặt</th>
                        <th>Tổng Tiền</th>
                        <th>Thanh Toán</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                    </thead>
                    <tbody id="ordersTable">
                    <tr>
                        <td colspan="7" class="text-center">Đang tải...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Update Status Modal -->
<div id="statusModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Cập Nhật Trạng Thái</h2>
            <button onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <form id="statusForm" onsubmit="updateStatus(event)">
            <input type="hidden" id="orderId"/>
            <div class="form-group">
                <label>Trạng thái mới</label>
                <select id="newStatus" class="form-control" required>
                    <option value="CONFIRMED">Xác nhận</option>
                    <option value="PROCESSING">Đang xử lý</option>
                    <option value="SHIPPED">Đang giao</option>
                    <option value="DELIVERED">Đã giao</option>
                    <option value="CANCELLED">Hủy</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeModal()" class="btn btn--outline">Hủy</button>
                <button type="submit" class="btn btn--small">Cập nhật</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentPage = 0;

    document.addEventListener('DOMContentLoaded', loadOrders);

    function loadOrders() {
        const status = document.getElementById('statusFilter').value;
        let url = `/api/orders/paginated?page=${currentPage}&size=20`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('ordersTable');
                if (data.content && data.content.length > 0) {
                    tbody.innerHTML = data.content.map(order => `
                        <tr>
                            <td><strong>${order.orderNumber}</strong></td>
                            <td>${order.userName || 'N/A'}</td>
                            <td>${new Date(order.createdAt).toLocaleDateString('vi-VN')}</td>
                            <td>${new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'}).format(order.totalAmount)}</td>
                            <td><span class="badge badge--${order.paymentStatus === 'PAID' ? 'delivered' : 'pending'}">${getPaymentText(order.paymentStatus)}</span></td>
                            <td><span class="badge badge--${order.status.toLowerCase()}">${getStatusText(order.status)}</span></td>
                            <td>
                                <button onclick="showStatusModal(${order.id}, '${order.status}')" class="btn btn--small">Cập nhật</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Không có đơn hàng</td></tr>';
                }
            })
            .catch(e => {
                console.error(e);
                document.getElementById('ordersTable').innerHTML =
                    '<tr><td colspan="7" class="text-center">Lỗi tải dữ liệu</td></tr>';
            });
    }

    function getStatusText(status) {
        const map = {
            'PENDING': 'Chờ xử lý',
            'PROCESSING': 'Đang xử lý',
            'CONFIRMED': 'Đã xác nhận',
            'SHIPPED': 'Đang giao',
            'DELIVERED': 'Đã giao',
            'CANCELLED': 'Đã hủy'
        };
        return map[status] || status;
    }

    function getPaymentText(status) {
        return status === 'PAID' ? 'Đã thanh toán' : 'Chưa thanh toán';
    }

    function showStatusModal(id, currentStatus) {
        document.getElementById('orderId').value = id;
        document.getElementById('newStatus').value = currentStatus;
        document.getElementById('statusModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('statusModal').style.display = 'none';
    }

    function updateStatus(e) {
        e.preventDefault();
        const id = document.getElementById('orderId').value;
        const status = document.getElementById('newStatus').value;

        fetch(`/api/orders/${id}/status?status=${status}`, {method: 'PUT'})
            .then(r => r.json())
            .then(() => {
                alert('Đã cập nhật trạng thái');
                closeModal();
                loadOrders();
            })
            .catch(e => alert('Có lỗi xảy ra'));
    }
</script>

<style>
    .table-card__header {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
    }
    .search-input, .filter-select {
        padding: 10px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
    }
    .search-input { flex: 1; }
    .filter-select { min-width: 180px; }
    
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 1001;
    }
    .modal-content {
        background: #fff;
        border-radius: 12px;
        width: 90%;
        max-width: 400px;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid #e0e0e0;
    }
    .modal-header h2 { margin: 0; font-size: 18px; }
    .modal-close {
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #666;
    }
    .modal-footer {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        padding: 20px;
        border-top: 1px solid #e0e0e0;
    }
    .form-group {
        padding: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
    }
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        box-sizing: border-box;
    }
    .btn--outline {
        background: #fff;
        border: 1px solid #e0e0e0;
        color: #333;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
    }
</style>

</body>
</html>
