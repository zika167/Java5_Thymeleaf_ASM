<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản Lý Users | Admin</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}"/>
</head>
<body class="admin-body">

<th:block th:replace="~{shared/fragments/admin-sidebar :: admin-sidebar}"></th:block>

<main class="admin-main">
    <div class="admin-header">
        <h1>Quản Lý Users</h1>
        <div class="admin-user">
            <img th:src="${session.user != null ? session.user.avatarUrlOrGravatar : '/assets/img/avatar.jpg'}" 
                 alt="" class="admin-user__avatar"/>
            <span th:text="${session.user != null ? session.user.fullName : 'Admin'}">Admin</span>
        </div>
    </div>

    <div class="admin-content">
        <div class="table-card">
            <div class="table-card__header">
                <input type="text" id="searchInput" placeholder="Tìm kiếm user..." class="search-input"/>
                <select id="roleFilter" class="filter-select">
                    <option value="">Tất cả roles</option>
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Họ Tên</th>
                        <th>Role</th>
                        <th>Trạng Thái</th>
                        <th>Ngày Tạo</th>
                    </tr>
                    </thead>
                    <tbody id="usersTable">
                    <tr>
                        <td colspan="7" class="text-center">Đang tải...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    let currentPage = 0;
    let currentRole = '';
    let searchQuery = '';

    document.addEventListener('DOMContentLoaded', function () {
        loadUsers();

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 0;
            loadUsers();
        });

        document.getElementById('roleFilter').addEventListener('change', (e) => {
            currentRole = e.target.value;
            currentPage = 0;
            loadUsers();
        });
    });

    function loadUsers() {
        let url = `/api/admin/users?page=${currentPage}&size=20`;
        if (currentRole) url += `&role=${currentRole}`;
        if (searchQuery) url += `&search=${searchQuery}`;

        fetch(url)
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('usersTable');
                if (data.content && data.content.length > 0) {
                    tbody.innerHTML = data.content.map(user => `
                      <tr>
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.email}</td>
                        <td>${user.fullName || 'N/A'}</td>
                        <td><span class="badge badge--${user.role === 'ADMIN' ? 'admin' : 'user'}">${user.role}</span></td>
                        <td><span class="badge badge--${user.active ? 'delivered' : 'cancelled'}">${user.active ? 'Active' : 'Inactive'}</span></td>
                        <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('vi-VN') : 'N/A'}</td>
                      </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Không có user</td></tr>';
                }
            })
            .catch(e => {
                console.error(e);
                document.getElementById('usersTable').innerHTML =
                    '<tr><td colspan="7" class="text-center">Lỗi tải dữ liệu</td></tr>';
            });
    }
</script>

<style>
    .table-card__header {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
    }
    .search-input, .filter-select {
        padding: 10px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
    }
    .search-input { flex: 1; }
    .filter-select { min-width: 150px; }
    .badge--admin { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .badge--user { background: #3b82f6; color: #fff; }
</style>

</body>
</html>
