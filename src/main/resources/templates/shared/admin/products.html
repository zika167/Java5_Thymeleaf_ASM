<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Quản Lý Products | Admin</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}"/>
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Bo tròn tất cả SweetAlert2 */
        .swal2-popup { border-radius: 16px !important; }
        .swal2-confirm, .swal2-cancel, .swal2-deny { border-radius: 8px !important; }
        .swal2-input, .swal2-textarea, .swal2-select { border-radius: 8px !important; }
        .swal2-toast { border-radius: 12px !important; }
    </style>
</head>
<body class="admin-body">

<th:block th:replace="~{shared/fragments/admin-sidebar :: admin-sidebar}"></th:block>

<main class="admin-main">
    <div class="admin-header">
        <h1>Quản Lý Products</h1>
        <div class="admin-user">
            <img th:src="${session.user != null ? session.user.avatarUrlOrGravatar : '/assets/img/avatar.jpg'}" 
                 alt="" class="admin-user__avatar"/>
            <span th:text="${session.user != null ? session.user.fullName : 'Admin'}">Admin</span>
        </div>
    </div>

    <div class="admin-content">
        <div class="table-card">
            <div class="table-card__header">
                <input type="text" id="searchInput" placeholder="Tìm sản phẩm..." class="search-input"/>
                <button onclick="showAddModal()" class="btn btn--primary">+ Thêm Sản Phẩm</button>
            </div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hình Ảnh</th>
                        <th>Tên Sản Phẩm</th>
                        <th>Danh Mục</th>
                        <th>Giá</th>
                        <th>Tồn Kho</th>
                        <th>Nổi Bật</th>
                        <th>Hành Động</th>
                    </tr>
                    </thead>
                    <tbody id="productsTable">
                    <tr>
                        <td colspan="8" class="text-center">Đang tải...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Add/Edit Product Modal -->
<div id="productModal" class="modal">
    <div class="modal-content modal-content--lg">
        <div class="modal-header">
            <h2 id="modalTitle">Thêm Sản Phẩm</h2>
            <button onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="productId"/>
            <input type="hidden" id="productImageUrl"/>
            
            <div class="form-body">
                <!-- Image Upload Section -->
                <div class="image-upload-section">
                    <label>Hình ảnh sản phẩm</label>
                    <div class="image-upload-box" onclick="document.getElementById('imageFile').click()">
                        <img id="imagePreview" src="/assets/img/product/item-1.png" alt="Preview"/>
                        <div class="upload-overlay">
                            <span>📷 Chọn ảnh</span>
                        </div>
                    </div>
                    <input type="file" id="imageFile" accept="image/*" onchange="handleImageSelect(event)" style="display:none"/>
                    <p class="upload-hint">Click để chọn ảnh (Max 5MB)</p>
                </div>

                <!-- Form Fields -->
                <div class="form-fields">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tên sản phẩm <span class="required">*</span></label>
                            <input type="text" id="productName" class="form-control" required placeholder="Nhập tên sản phẩm"/>
                        </div>
                        <div class="form-group">
                            <label>SKU</label>
                            <input type="text" id="productSku" class="form-control" placeholder="VD: SP-001"/>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Giá (VND) <span class="required">*</span></label>
                            <input type="number" id="productPrice" class="form-control" required min="0" placeholder="0"/>
                        </div>
                        <div class="form-group">
                            <label>Giá khuyến mãi</label>
                            <input type="number" id="productDiscountPrice" class="form-control" min="0" placeholder="Để trống nếu không KM"/>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Số lượng tồn kho</label>
                            <input type="number" id="productStock" class="form-control" value="0" min="0"/>
                        </div>
                        <div class="form-group">
                            <label>Danh mục</label>
                            <select id="productCategory" class="form-control">
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Thương hiệu</label>
                            <select id="productBrand" class="form-control">
                                <option value="">-- Chọn thương hiệu --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label-inline">
                                <input type="checkbox" id="productFeatured"/>
                                <span>⭐ Sản phẩm nổi bật</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group form-group--full">
                        <label>Mô tả ngắn</label>
                        <input type="text" id="productShortDesc" class="form-control" placeholder="Mô tả ngắn gọn về sản phẩm"/>
                    </div>

                    <div class="form-group form-group--full">
                        <label>Mô tả chi tiết</label>
                        <textarea id="productDescription" class="form-control" rows="3" placeholder="Mô tả chi tiết sản phẩm..."></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" onclick="closeModal()" class="btn btn--outline">Hủy</button>
                <button type="submit" class="btn btn--primary">💾 Lưu sản phẩm</button>
            </div>
        </form>
    </div>
</div>

<script>
    // CSRF token
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    // Toast config
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
    });

    let currentPage = 0;
    let categories = [];
    let brands = [];
    let selectedImageFile = null;

    document.addEventListener('DOMContentLoaded', function () {
        loadProducts();
        loadCategories();
        loadBrands();

        document.getElementById('searchInput').addEventListener('input', debounce(() => {
            currentPage = 0;
            loadProducts();
        }, 300));
    });

    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    function loadProducts() {
        const search = document.getElementById('searchInput').value;
        let url = `/api/products?page=${currentPage}&size=20`;
        if (search) url += `&search=${encodeURIComponent(search)}`;

        fetch(url)
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('productsTable');
                const products = data.products || data.content || [];
                if (products.length > 0) {
                    tbody.innerHTML = products.map(product => {
                        const stock = product.stockQuantity || 0;
                        const safeName = (product.name || '').replace(/'/g, "\\'");
                        return `
                        <tr>
                            <td>${product.id}</td>
                            <td><img src="${product.imageUrl || '/assets/img/product/item-1.png'}" alt="" class="table-product-img"/></td>
                            <td><strong>${product.name}</strong></td>
                            <td>${product.categoryName || 'N/A'}</td>
                            <td>
                                ${product.discountPrice ? 
                                    `<span class="price-old">${formatPrice(product.price)}</span><br><span class="price-new">${formatPrice(product.discountPrice)}</span>` : 
                                    formatPrice(product.price)}
                            </td>
                            <td>
                                <span class="stock-badge ${stock > 10 ? 'stock-ok' : stock > 0 ? 'stock-low' : 'stock-out'}">
                                    ${stock}
                                </span>
                            </td>
                            <td>
                                <button onclick="toggleFeatured(${product.id}, '${safeName}')" class="btn btn--icon ${product.isFeatured ? 'btn--featured' : ''}">
                                    ${product.isFeatured ? '⭐' : '☆'}
                                </button>
                            </td>
                            <td class="action-buttons">
                                <button onclick="editProduct(${product.id})" class="btn btn--small btn--info" title="Sửa">✏️</button>
                                <button onclick="updateStock(${product.id}, ${stock}, '${safeName}')" class="btn btn--small btn--warning" title="Cập nhật tồn kho">📦</button>
                                <button onclick="deleteProduct(${product.id}, '${safeName}')" class="btn btn--small btn--danger" title="Xóa">🗑️</button>
                            </td>
                        </tr>
                    `}).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">Không có sản phẩm</td></tr>';
                }
            })
            .catch(e => {
                console.error(e);
                Toast.fire({ icon: 'error', title: 'Lỗi tải dữ liệu' });
            });
    }

    function loadCategories() {
        fetch('/api/categories')
            .then(r => r.json())
            .then(data => {
                categories = data;
                const select = document.getElementById('productCategory');
                select.innerHTML = '<option value="">-- Chọn danh mục --</option>' +
                    data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            })
            .catch(e => console.error('Error loading categories:', e));
    }

    function loadBrands() {
        fetch('/api/brands')
            .then(r => r.json())
            .then(data => {
                brands = data;
                const select = document.getElementById('productBrand');
                select.innerHTML = '<option value="">-- Chọn thương hiệu --</option>' +
                    data.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            })
            .catch(e => console.error('Error loading brands:', e));
    }

    function formatPrice(price) {
        return new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'}).format(price);
    }

    // Image handling
    function handleImageSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Validate
        if (!file.type.startsWith('image/')) {
            Toast.fire({ icon: 'error', title: 'Vui lòng chọn file hình ảnh' });
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            Toast.fire({ icon: 'error', title: 'File không được vượt quá 5MB' });
            return;
        }

        selectedImageFile = file;

        // Preview
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function uploadImage() {
        if (!selectedImageFile) return null;

        const formData = new FormData();
        formData.append('file', selectedImageFile);

        try {
            const response = await fetch('/api/admin/upload/product-image', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                },
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                return data.imageUrl;
            } else {
                throw new Error(data.message);
            }
        } catch (e) {
            console.error('Upload error:', e);
            throw e;
        }
    }

    function showAddModal() {
        document.getElementById('modalTitle').textContent = 'Thêm Sản Phẩm';
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
        document.getElementById('productImageUrl').value = '';
        document.getElementById('imagePreview').src = '/assets/img/product/item-1.png';
        selectedImageFile = null;
        document.getElementById('productModal').style.display = 'flex';
    }

    function editProduct(id) {
        fetch(`/api/products/${id}`)
            .then(r => r.json())
            .then(product => {
                document.getElementById('modalTitle').textContent = 'Sửa Sản Phẩm';
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name || '';
                document.getElementById('productSku').value = product.sku || '';
                document.getElementById('productPrice').value = product.price || '';
                document.getElementById('productDiscountPrice').value = product.discountPrice || '';
                document.getElementById('productStock').value = product.stockQuantity || 0;
                document.getElementById('productCategory').value = product.categoryId || '';
                document.getElementById('productBrand').value = product.brandId || '';
                document.getElementById('productImageUrl').value = product.imageUrl || '';
                document.getElementById('imagePreview').src = product.imageUrl || '/assets/img/product/item-1.png';
                document.getElementById('productShortDesc').value = product.shortDescription || '';
                document.getElementById('productDescription').value = product.description || '';
                document.getElementById('productFeatured').checked = product.isFeatured || false;
                selectedImageFile = null;
                document.getElementById('productModal').style.display = 'flex';
            })
            .catch(e => Toast.fire({ icon: 'error', title: 'Lỗi tải thông tin sản phẩm' }));
    }

    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
        selectedImageFile = null;
    }

    async function saveProduct(e) {
        e.preventDefault();
        
        const id = document.getElementById('productId').value;
        let imageUrl = document.getElementById('productImageUrl').value;

        // Show loading
        Swal.fire({
            title: 'Đang xử lý...',
            html: selectedImageFile ? 'Đang upload hình ảnh...' : 'Đang lưu sản phẩm...',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        try {
            // Upload image if selected
            if (selectedImageFile) {
                imageUrl = await uploadImage();
            }

            const data = {
                name: document.getElementById('productName').value,
                sku: document.getElementById('productSku').value || null,
                price: parseFloat(document.getElementById('productPrice').value),
                discountPrice: document.getElementById('productDiscountPrice').value ? parseFloat(document.getElementById('productDiscountPrice').value) : null,
                stockQuantity: parseInt(document.getElementById('productStock').value) || 0,
                categoryId: document.getElementById('productCategory').value ? parseInt(document.getElementById('productCategory').value) : null,
                brandId: document.getElementById('productBrand').value ? parseInt(document.getElementById('productBrand').value) : null,
                imageUrl: imageUrl || null,
                shortDescription: document.getElementById('productShortDesc').value || null,
                description: document.getElementById('productDescription').value || null,
                isFeatured: document.getElementById('productFeatured').checked
            };

            const url = id ? `/api/admin/products/${id}` : '/api/admin/products';
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: { 
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error('Request failed');

            Swal.fire({
                icon: 'success',
                title: 'Thành công!',
                text: id ? 'Đã cập nhật sản phẩm' : 'Đã thêm sản phẩm mới',
                timer: 1500,
                showConfirmButton: false
            });
            closeModal();
            loadProducts();

        } catch (e) {
            Swal.fire({
                icon: 'error',
                title: 'Lỗi!',
                text: 'Có lỗi xảy ra: ' + e.message
            });
        }
    }

    function deleteProduct(id, name) {
        Swal.fire({
            title: '🗑️ Xác nhận xóa?',
            html: `Bạn có chắc muốn xóa sản phẩm <strong>"${name}"</strong>?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            confirmButtonText: '🗑️ Xóa',
            cancelButtonText: 'Hủy'
        }).then((result) => {
            if (result.isConfirmed) {
                fetch(`/api/admin/products/${id}`, { 
                    method: 'DELETE',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                })
                    .then(r => r.json())
                    .then(data => {
                        Toast.fire({ icon: 'success', title: data.message });
                        loadProducts();
                    })
                    .catch(e => Toast.fire({ icon: 'error', title: 'Có lỗi xảy ra' }));
            }
        });
    }

    function updateStock(id, currentStock, name) {
        const stock = currentStock || 0;
        Swal.fire({
            title: 'Cập nhật tồn kho',
            html: `<p style="color:#666;margin-bottom:16px">${name}</p>
                   <p style="font-size:13px;color:#888">Hiện tại: <strong>${stock}</strong></p>`,
            input: 'number',
            inputValue: stock,
            inputAttributes: { min: 0 },
            inputPlaceholder: 'Nhập số lượng',
            showCancelButton: true,
            confirmButtonText: 'Lưu',
            cancelButtonText: 'Hủy',
            confirmButtonColor: '#667eea',
            inputValidator: (value) => {
                if (value === '' || parseInt(value) < 0) return 'Số lượng không hợp lệ';
            }
        }).then((result) => {
            if (result.isConfirmed) {
                const quantity = parseInt(result.value);
                console.log('Updating stock for product', id, 'to', quantity);
                
                fetch(`/api/admin/products/${id}/stock?quantity=${quantity}`, { 
                    method: 'PUT',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                })
                .then(r => {
                    console.log('Response status:', r.status);
                    if (r.status === 403) {
                        throw new Error('Bạn không có quyền thực hiện thao tác này');
                    }
                    if (r.status === 401) {
                        throw new Error('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại');
                    }
                    if (!r.ok) {
                        return r.text().then(text => {
                            console.error('Error response:', text);
                            throw new Error('Request failed: ' + r.status);
                        });
                    }
                    return r.json();
                })
                .then(data => {
                    console.log('Success:', data);
                    if (data.success === false) {
                        Toast.fire({ icon: 'error', title: data.message || 'Có lỗi xảy ra' });
                    } else {
                        Toast.fire({ icon: 'success', title: data.message || 'Đã cập nhật tồn kho' });
                        loadProducts();
                    }
                })
                .catch(e => {
                    console.error('Update stock error:', e);
                    Toast.fire({ icon: 'error', title: e.message || 'Có lỗi xảy ra' });
                });
            }
        });
    }

    function toggleFeatured(id, name) {
        fetch(`/api/admin/products/${id}/featured`, { 
            method: 'PUT',
            headers: {
                [csrfHeader]: csrfToken
            }
        })
            .then(r => r.json())
            .then(data => {
                Toast.fire({ icon: 'success', title: data.message });
                loadProducts();
            })
            .catch(e => Toast.fire({ icon: 'error', title: 'Có lỗi xảy ra' }));
    }
</script>

<style>
    .table-card__header {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
    }
    .search-input {
        padding: 10px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        flex: 1;
    }
    .btn--primary {
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
    }
    
    .table-product-img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border-radius: 8px;
    }
    
    .price-old {
        text-decoration: line-through;
        color: #999;
        font-size: 12px;
    }
    .price-new {
        color: #e53935;
        font-weight: 600;
    }
    
    .stock-badge {
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
    }
    .stock-ok { background: #d4edda; color: #155724; }
    .stock-low { background: #fff3cd; color: #856404; }
    .stock-out { background: #f8d7da; color: #721c24; }
    
    .btn--icon {
        background: none;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 16px;
    }
    .btn--featured {
        background: #fff3cd;
        border-color: #ffc107;
    }
    
    .action-buttons {
        display: flex;
        flex-wrap: nowrap;
        gap: 4px;
        align-items: center;
        white-space: nowrap;
    }
    .btn--info { background: #17a2b8; }
    .btn--warning { background: #ffc107; color: #333; }
    .btn--danger { background: #dc3545; }
    
    .btn--small {
        padding: 6px 10px;
        font-size: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
    }
    
    /* Fix table alignment */
    .admin-table td {
        vertical-align: middle;
    }
    
    /* Modal styles */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 1001;
    }
    .modal-content {
        background: #fff;
        border-radius: 12px;
        width: 90%;
        max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid #e0e0e0;
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
    }
    .modal-header h2 { margin: 0; font-size: 20px; }
    .modal-close {
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #666;
    }
    .modal-footer {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        padding: 20px 24px;
        border-top: 1px solid #e0e0e0;
        position: sticky;
        bottom: 0;
        background: #fff;
    }
    
    /* Form body layout */
    .form-body {
        display: flex;
        gap: 24px;
        padding: 24px;
    }
    
    /* Image upload section */
    .image-upload-section {
        width: 200px;
        flex-shrink: 0;
    }
    .image-upload-section > label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 14px;
    }
    .image-upload-box {
        width: 200px;
        height: 200px;
        border: 2px dashed #e0e0e0;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        transition: border-color 0.3s;
    }
    .image-upload-box:hover {
