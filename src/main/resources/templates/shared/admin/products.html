<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản Lý Products | Admin</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}"/>
</head>
<body class="admin-body">

<th:block th:replace="~{shared/fragments/admin-sidebar :: admin-sidebar}"></th:block>

<main class="admin-main">
    <div class="admin-header">
        <h1>Quản Lý Products</h1>
        <div class="admin-user">
            <img th:src="${session.user != null ? session.user.avatarUrlOrGravatar : '/assets/img/avatar.jpg'}" 
                 alt="" class="admin-user__avatar"/>
            <span th:text="${session.user != null ? session.user.fullName : 'Admin'}">Admin</span>
        </div>
    </div>

    <div class="admin-content">
        <div class="table-card">
            <div class="table-card__header">
                <input type="text" id="searchInput" placeholder="Tìm sản phẩm..." class="search-input"/>
            </div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hình Ảnh</th>
                        <th>Tên Sản Phẩm</th>
                        <th>Danh Mục</th>
                        <th>Giá</th>
                        <th>Tồn Kho</th>
                        <th>Trạng Thái</th>
                    </tr>
                    </thead>
                    <tbody id="productsTable">
                    <tr>
                        <td colspan="7" class="text-center">Đang tải...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    let currentPage = 0;

    document.addEventListener('DOMContentLoaded', loadProducts);

    function loadProducts() {
        fetch(`/api/products?page=${currentPage}&size=20`)
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('productsTable');
                if (data.products && data.products.length > 0) {
                    tbody.innerHTML = data.products.map(product => `
                        <tr>
                            <td>${product.id}</td>
                            <td><img src="${product.imageUrl || '/assets/img/product/item-1.png'}" alt="" style="width:50px;height:50px;object-fit:cover;border-radius:8px" /></td>
                            <td><strong>${product.name}</strong></td>
                            <td>${product.categoryName || 'N/A'}</td>
                            <td>${new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'}).format(product.price)}</td>
                            <td>${product.stockQuantity}</td>
                            <td><span class="badge badge--${product.stockQuantity > 0 ? 'delivered' : 'cancelled'}">${product.stockQuantity > 0 ? 'Còn hàng' : 'Hết hàng'}</span></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Không có sản phẩm</td></tr>';
                }
            })
            .catch(e => {
                console.error(e);
                document.getElementById('productsTable').innerHTML =
                    '<tr><td colspan="7" class="text-center">Lỗi tải dữ liệu</td></tr>';
            });
    }
</script>

<style>
    .table-card__header {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
    }
    .search-input {
        padding: 10px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        flex: 1;
    }
</style>

</body>
</html>
