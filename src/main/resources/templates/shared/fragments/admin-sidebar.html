<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="admin-sidebar" class="admin-sidebar">
    <style>
        .admin-sidebar {
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, #0e7490 0%, #155e75 50%, #164e63 100%);
            color: #fff;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        }

        .admin-sidebar__header {
            padding: 28px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.1);
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: #fff;
        }

        .admin-logo__icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(34, 211, 238, 0.4);
        }

        .admin-logo__img {
            width: 28px;
            height: 28px;
            filter: brightness(0) invert(1);
        }

        .admin-logo__text {
            display: flex;
            flex-direction: column;
        }

        .admin-logo__title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .admin-logo__subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        .admin-nav {
            flex: 1;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .admin-nav__label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            padding: 0 12px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .admin-nav__list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }

        .admin-nav__item {
            margin-bottom: 6px;
        }

        .admin-nav__link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 15px;
            border-radius: 12px;
            font-weight: 500;
        }

        .admin-nav__link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateX(4px);
        }

        .admin-nav__link--active {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%) !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.4);
            transform: translateX(0) !important;
        }

        .admin-nav__icon-wrapper {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .admin-nav__link:hover .admin-nav__icon-wrapper {
            background: rgba(255, 255, 255, 0.2);
        }

        .admin-nav__link--active .admin-nav__icon-wrapper {
            background: rgba(255, 255, 255, 0.25);
        }

        .admin-nav__icon {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }

        .admin-nav__text {
            flex: 1;
        }

        .admin-sidebar__footer {
            padding: 20px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.1);
        }

        .admin-sidebar__footer .admin-nav__list {
            margin: 0;
        }

        .admin-sidebar__footer .admin-nav__link {
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        .admin-sidebar__footer .admin-nav__link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .admin-sidebar__footer .admin-nav__icon-wrapper {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.08);
        }

        .logout-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2) !important;
        }

        .logout-btn .admin-nav__icon-wrapper {
            background: rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 768px) {
            .admin-sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
        }
    </style>

    <div class="admin-sidebar__header">
        <a th:href="@{/}" class="admin-logo">
            <div class="admin-logo__icon">
                <img th:src="@{/assets/icon/logo.svg}" alt="grocerystore" class="admin-logo__img"/>
            </div>
            <div class="admin-logo__text">
                <h2 class="admin-logo__title">Admin Panel</h2>
                <span class="admin-logo__subtitle">Quản lý cửa hàng</span>
            </div>
        </a>
    </div>

    <nav class="admin-nav">
        <div class="admin-nav__label">Menu chính</div>
        <ul class="admin-nav__list">
            <li class="admin-nav__item">
                <a th:href="@{/admin/dashboard}" class="admin-nav__link" data-page="dashboard">
                    <div class="admin-nav__icon-wrapper">
                        <img th:src="@{/assets/icon/document.svg}" alt="" class="admin-nav__icon"/>
                    </div>
                    <span class="admin-nav__text">Dashboard</span>
                </a>
            </li>
            <li class="admin-nav__item">
                <a th:href="@{/admin/users}" class="admin-nav__link" data-page="users">
                    <div class="admin-nav__icon-wrapper">
                        <img th:src="@{/assets/icon/profile.svg}" alt="" class="admin-nav__icon"/>
                    </div>
                    <span class="admin-nav__text">Quản lý Users</span>
                </a>
            </li>
            <li class="admin-nav__item">
                <a th:href="@{/admin/orders}" class="admin-nav__link" data-page="orders">
                    <div class="admin-nav__icon-wrapper">
                        <img th:src="@{/assets/icon/bag.svg}" alt="" class="admin-nav__icon"/>
                    </div>
                    <span class="admin-nav__text">Quản lý Orders</span>
                </a>
            </li>
            <li class="admin-nav__item">
                <a th:href="@{/admin/products}" class="admin-nav__link" data-page="products">
                    <div class="admin-nav__icon-wrapper">
                        <img th:src="@{/assets/icon/gift.svg}" alt="" class="admin-nav__icon"/>
                    </div>
                    <span class="admin-nav__text">Quản lý Products</span>
                </a>
            </li>
            <li class="admin-nav__item">
                <a th:href="@{/admin/brands}" class="admin-nav__link" data-page="brands">
                    <div class="admin-nav__icon-wrapper">
                        <img th:src="@{/assets/icon/star.svg}" alt="" class="admin-nav__icon"/>
                    </div>
                    <span class="admin-nav__text">Quản lý Brands</span>
                </a>
            </li>
            <li class="admin-nav__item">
                <a th:href="@{/admin/analytics}" class="admin-nav__link" data-page="analytics">
                    <div class="admin-nav__icon-wrapper">
                        <span style="font-size: 20px;">📊</span>
                    </div>
                    <span class="admin-nav__text">Quản lý Truy cập</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="admin-sidebar__footer">
        <ul class="admin-nav__list">
            <li class="admin-nav__item">
                <a th:href="@{/}" class="admin-nav__link">
                    <div class="admin-nav__icon-wrapper">
                        <img th:src="@{/assets/icon/arrow-left.svg}" alt="" class="admin-nav__icon"/>
                    </div>
                    <span class="admin-nav__text">Về trang chủ</span>
                </a>
            </li>
            <li class="admin-nav__item">
                <form th:action="@{/auth/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="admin-nav__link logout-btn">
                        <div class="admin-nav__icon-wrapper">
                            <img th:src="@{/assets/icon/lock.svg}" alt="" class="admin-nav__icon"/>
                        </div>
                        <span class="admin-nav__text">Đăng xuất</span>
                    </button>
                </form>
            </li>
        </ul>
    </div>

    <script>
        (function() {
            const path = window.location.pathname;
            const links = document.querySelectorAll('.admin-nav__link[data-page]');
            links.forEach(link => {
                const page = link.getAttribute('data-page');
                if (path.includes('/admin/' + page)) {
                    link.classList.add('admin-nav__link--active');
                }
            });
        })();
    </script>
</aside>
</body>
</html>
