<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Notification Modal Fragment -->
<div th:fragment="notification-modal">
    <!-- Notification Modal -->
    <div id="notificationModal" class="notification-modal">
        <div class="notification-modal__overlay"></div>
        <div class="notification-modal__content">
            <div class="notification-modal__icon" id="notificationIcon"></div>
            <h3 class="notification-modal__title" id="notificationTitle">Thông báo</h3>
            <p class="notification-modal__message" id="notificationMessage"></p>
            <div class="notification-modal__actions">
                <button type="button" class="btn btn--primary notification-modal__btn" onclick="NotificationModal.close()">OK</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="notification-modal">
        <div class="notification-modal__overlay"></div>
        <div class="notification-modal__content">
            <div class="notification-modal__icon notification-modal__icon--warning" id="confirmIcon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <h3 class="notification-modal__title" id="confirmTitle">Xác nhận</h3>
            <p class="notification-modal__message" id="confirmMessage"></p>
            <div class="notification-modal__actions notification-modal__actions--dual">
                <button type="button" class="btn btn--outline notification-modal__btn" onclick="NotificationModal.cancelConfirm()">Hủy</button>
                <button type="button" class="btn btn--primary notification-modal__btn" onclick="NotificationModal.acceptConfirm()">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Feature In Development Modal -->
    <div id="featureDevModal" class="notification-modal">
        <div class="notification-modal__overlay" onclick="NotificationModal.closeFeatureDev()"></div>
        <div class="notification-modal__content notification-modal__content--dev">
            <div class="notification-modal__icon notification-modal__icon--dev">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                </svg>
            </div>
            <h3 class="notification-modal__title notification-modal__title--dev">🚧 Tính năng đang phát triển</h3>
            <p class="notification-modal__message">Chức năng này hiện đang được phát triển và sẽ sớm ra mắt trong các phiên bản tiếp theo.<br><br>Cảm ơn bạn đã kiên nhẫn chờ đợi!</p>
            <div class="notification-modal__actions">
                <button type="button" class="btn btn--primary notification-modal__btn notification-modal__btn--dev" onclick="NotificationModal.closeFeatureDev()">Đã hiểu</button>
            </div>
        </div>
    </div>

    <style>
        .notification-modal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .notification-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .notification-modal__overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .notification-modal__content {
            position: relative;
            z-index: 1;
            background: var(--dialog-bg, #fff);
            border-radius: 20px;
            padding: 32px 28px;
            width: min(420px, 90vw);
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.3s ease;
        }
        .notification-modal.show .notification-modal__content {
            transform: scale(1) translateY(0);
        }
        .notification-modal__icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notification-modal__icon--success {
            background: #e8f5e9;
            color: #4caf50;
        }
        .notification-modal__icon--error {
            background: #ffebee;
            color: #f44336;
        }
        .notification-modal__icon--warning {
            background: #fff8e1;
            color: #ff9800;
        }
        .notification-modal__icon--info {
            background: #e3f2fd;
            color: #2196f3;
        }
        .notification-modal__icon--dev {
            background: linear-gradient(135deg, #77dae6 0%, #5bc7d4 100%);
            color: #fff;
            width: 80px;
            height: 80px;
        }
        .notification-modal__icon svg {
            width: 36px;
            height: 36px;
        }
        .notification-modal__icon--dev svg {
            width: 40px;
            height: 40px;
        }
        .notification-modal__title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color, #1a162e);
        }
        .notification-modal__title--dev {
            font-size: 2.2rem;
            color: #5bc7d4;
        }
        .notification-modal__message {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 28px;
        }
        .notification-modal__actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .notification-modal__actions--dual {
            justify-content: center;
        }
        .notification-modal__btn {
            min-width: 120px;
            padding: 12px 24px;
            font-size: 1.5rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .notification-modal__btn--dev {
            background: linear-gradient(135deg, #77dae6 0%, #5bc7d4 100%) !important;
            border: none;
            color: #fff !important;
            min-width: 140px;
        }
        .notification-modal__btn--dev:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(119, 218, 230, 0.4);
        }
        .notification-modal__content--dev {
            border-top: 5px solid #77dae6;
            padding-top: 36px;
        }
        
        /* Dark mode support */
        html.dark .notification-modal__message {
            color: #b9babe;
        }
        html.dark .notification-modal__title--dev {
            color: #77dae6;
        }
    </style>

    <!-- Inline script để đảm bảo modal hoạt động ngay khi footer load -->
    <script>
    (function() {
        // Tránh chạy lại nếu đã init
        if (window._notificationModalInitialized) return;
        window._notificationModalInitialized = true;
        
        // Icons SVG
        var icons = {
            success: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9 12l2 2 4-4"></path></svg>',
            error: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
            warning: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
            info: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
        };
        
        var defaultTitles = {
            success: 'Thành công',
            error: 'Lỗi',
            warning: 'Cảnh báo',
            info: 'Thông báo'
        };
        
        // Override NotificationModal với đầy đủ functions
        window.NotificationModal = {
            _confirmResolve: null,
            
            show: function(message, type, title) {
                type = type || 'info';
                var modal = document.getElementById('notificationModal');
                var iconEl = document.getElementById('notificationIcon');
                var titleEl = document.getElementById('notificationTitle');
                var messageEl = document.getElementById('notificationMessage');
                
                if (!modal) return;
                
                iconEl.innerHTML = icons[type] || icons.info;
                iconEl.className = 'notification-modal__icon notification-modal__icon--' + type;
                titleEl.textContent = title || defaultTitles[type] || 'Thông báo';
                messageEl.textContent = message;
                
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            },
            
            success: function(message, title) { this.show(message, 'success', title); },
            error: function(message, title) { this.show(message, 'error', title); },
            warning: function(message, title) { this.show(message, 'warning', title); },
            info: function(message, title) { this.show(message, 'info', title); },
            
            close: function() {
                var modal = document.getElementById('notificationModal');
                if (modal) {
                    modal.classList.remove('show');
                    document.body.style.overflow = '';
                }
            },
            
            showFeatureDev: function() {
                var modal = document.getElementById('featureDevModal');
                if (modal) {
                    modal.classList.add('show');
                    document.body.style.overflow = 'hidden';
                }
            },
            
            closeFeatureDev: function() {
                var modal = document.getElementById('featureDevModal');
                if (modal) {
                    modal.classList.remove('show');
                    document.body.style.overflow = '';
                }
            },
            
            confirm: function(message, title) {
                var self = this;
                return new Promise(function(resolve) {
                    var modal = document.getElementById('confirmModal');
                    var titleEl = document.getElementById('confirmTitle');
                    var messageEl = document.getElementById('confirmMessage');
                    
                    if (!modal) { resolve(confirm(message)); return; }
                    
                    self._confirmResolve = resolve;
                    titleEl.textContent = title || 'Xác nhận';
                    messageEl.textContent = message;
                    
                    modal.classList.add('show');
                    document.body.style.overflow = 'hidden';
                });
            },
            
            acceptConfirm: function() {
                var modal = document.getElementById('confirmModal');
                if (modal) { modal.classList.remove('show'); document.body.style.overflow = ''; }
                if (this._confirmResolve) { this._confirmResolve(true); this._confirmResolve = null; }
            },
            
            cancelConfirm: function() {
                var modal = document.getElementById('confirmModal');
                if (modal) { modal.classList.remove('show'); document.body.style.overflow = ''; }
                if (this._confirmResolve) { this._confirmResolve(false); this._confirmResolve = null; }
            }
        };
        
        // Auto-bind href="#!" links - dùng capturing để bắt sớm nhất
        document.addEventListener('click', function(e) {
            var link = e.target.closest('a[href="#!"], button.feature-dev');
            if (link) {
                e.preventDefault();
                e.stopPropagation();
                window.NotificationModal.showFeatureDev();
            }
        }, true);
        
        // Close on ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                window.NotificationModal.closeFeatureDev();
                window.NotificationModal.close();
                window.NotificationModal.cancelConfirm();
            }
        });
    })();
    </script>
</div>
</html>
