<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Cửa hàng Cà phê - Trang chủ')}"></head>
<body>
<header th:replace="~{shared/fragments/header :: header}"></header>

<div class="container home">
    <!-- Slideshow -->
    <div class="home__container">
        <div class="slideshow">
            <div class="slideshow__inner">
                <div class="slideshow__item">
                    <a href="#!" class="slideshow__link">
                        <picture>
                            <source media="(max-width: 767.98px)" srcset="./assets/img/slideshow/item-1-md.png"/>
                            <img th:src="@{/assets/img/slideshow/item-1.png}" alt="" class="slideshow__img"/>
                        </picture>
                    </a>
                </div>
                <div class="slideshow__item">
                    <a href="#!" class="slideshow__link">
                        <picture>
                            <source media="(max-width: 767.98px)" srcset="./assets/img/slideshow/slider-2.png"/>
                            <img th:src="@{/assets/img/slideshow/slider-2.png}" alt="" class="slideshow__img"/>
                        </picture>
                    </a>
                </div>
                <div class="slideshow__item">
                    <a href="#!" class="slideshow__link">
                        <picture>
                            <source media="(max-width: 767.98px)" srcset="./assets/img/slideshow/slider-3.png"/>
                            <img th:src="@{/assets/img/slideshow/slider-3.png}" alt="" class="slideshow__img"/>
                        </picture>
                    </a>
                </div>
                <div class="slideshow__item">
                    <a href="#!" class="slideshow__link">
                        <picture>
                            <source media="(max-width: 767.98px)" srcset="./assets/img/slideshow/slider-4.png"/>
                            <img th:src="@{/assets/img/slideshow/slider-4.png}" alt="" class="slideshow__img"/>
                        </picture>
                    </a>
                </div>
                <div class="slideshow__item">
                    <a href="#!" class="slideshow__link">
                        <picture>
                            <source media="(max-width: 767.98px)" srcset="./assets/img/slideshow/slider-5.png"/>
                            <img th:src="@{/assets/img/slideshow/slider-5.png}" alt="" class="slideshow__img"/>
                        </picture>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Browse Categories -->
    <section class="home__container">
        <div class="home__row">
            <h2 class="home__heading">Danh mục nổi bật</h2>
        </div>
        <div class="home__cate row row-cols-3 row-cols-md-1">
            <div class="col">
                <a th:href="@{/product/1}">
                    <article class="cate-item">
                        <img th:src="@{/assets/img/category-item/item-1.png}" alt="" class="cate-item__thumb"/>
                        <div class="cate-item__info">
                            <h3 class="cate-item__title">800.000đ - 4.000.000đ</h3>
                            <p class="cate-item__desc">Cà phê hạt Lavazza cao cấp</p>
                        </div>
                    </article>
                </a>
            </div>
            <div class="col">
                <a th:href="@{/product/2}">
                    <article class="cate-item">
                        <img th:src="@{/assets/img/category-item/item-2.png}" alt="" class="cate-item__thumb"/>
                        <div class="cate-item__info">
                            <h3 class="cate-item__title">600.000đ - 3.750.000đ</h3>
                            <p class="cate-item__desc">Cà phê Sumatra Mandeling blend</p>
                        </div>
                    </article>
                </a>
            </div>
            <div class="col">
                <a th:href="@{/product/3}">
                    <article class="cate-item">
                        <img th:src="@{/assets/img/category-item/item-3.png}" alt="" class="cate-item__thumb"/>
                        <div class="cate-item__info">
                            <h3 class="cate-item__title">925.000đ - 4.000.000đ</h3>
                            <p class="cate-item__desc">Cà phê Espresso Arabica và Robusta</p>
                        </div>
                    </article>
                </a>
            </div>
        </div>
    </section>

    <!-- Browse Products -->
    <section class="home__container">
        <div class="home__row">
            <h2 class="home__heading">Sản phẩm nổi bật</h2>
            <div class="filter-wrap">
                <button class="filter-btn js-toggle" toggle-target="#home-filter">
                    Lọc
                    <img th:src="@{/assets/icon/filter.svg}" alt="" class="filter-btn__icon icon"/>
                </button>
                <div id="home-filter" class="filter hide">
                    <img th:src="@{/assets/icon/filter-triangle.svg}" alt="" class="filter__arrow"/>
                    <h3 class="filter__heading">Bộ lọc</h3>
                    <form action="" class="filter__form form">
                        <div class="filter__row filter__content">
                            <div class="filter__col">
                                <label class="form__label">Giá (nghìn đồng)</label>
                                <div class="slider-container">
                                    <div class="range-slider">
                                        <div class="slider-track"></div>
                                        <input type="range" id="min-price" min="0" max="5000" step="50" value="500" oninput="updatePrice()"/>
                                        <input type="range" id="max-price" min="0" max="5000" step="50" value="3000" oninput="updatePrice()"/>
                                    </div>
                                </div>
                                <div class="price-values">
                                    <div>
                                        <span>Tối thiểu: </span>
                                        <span id="min-price-value">500.000đ</span>
                                    </div>
                                    <div>
                                        <span>Tối đa: </span>
                                        <span id="max-price-value">3.000.000đ</span>
                                    </div>
                                </div>
                            </div>
                            <div class="filter__separate"></div>
                            <div class="filter__col">
                                <label for="" class="form__label">Khối lượng</label>
                                <div class="filter__form-group">
                                    <div class="form__select-wrap">
                                        <div class="form__select">
                                            <select class="weight-size">
                                                <option value="200g">200g</option>
                                                <option value="300g">300g</option>
                                                <option value="400g">400g</option>
                                                <option value="500g" selected>500g</option>
                                                <option value="600g">600g</option>
                                                <option value="700g">700g</option>
                                                <option value="800g">800g</option>
                                                <option value="900g">900g</option>
                                                <option value="1000g">1000g</option>
                                            </select>
                                        </div>
                                        <div class="form__select">
                                            <select class="weight-size" style="--width: 118px">
                                                <option value="gram">Gram</option>
                                                <option value="pao">Pao</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="filter__form-group">
                                    <div class="form__tags">
                                        <button type="button" class="form__tag btn1" onclick="toggleSelected1(this)">Nhỏ</button>
                                        <button type="button" class="form__tag btn1" onclick="toggleSelected1(this)">Vừa</button>
                                        <button type="button" class="form__tag btn1" onclick="toggleSelected1(this)">Lớn</button>
                                    </div>
                                </div>
                            </div>
                            <div class="filter__separate"></div>
                            <div class="filter__col">
                                <label for="" class="form__label">Thương hiệu</label>
                                <div class="filter__form-group">
                                    <div class="filter__form-text-input">
                                        <input type="text" placeholder="Tìm thương hiệu" class="filter__form-input"/>
                                        <img th:src="@{/assets/icon/filter-search.svg}" alt="" class="filter__form-input-icon icon"/>
                                    </div>
                                </div>
                                <div class="filter__form-group">
                                    <div class="form__tags">
                                        <button type="button" class="form__tag btn2" onclick="toggleSelected2(this)">Lavazza</button>
                                        <button type="button" class="form__tag btn2" onclick="toggleSelected2(this)">Nescafe</button>
                                        <button type="button" class="form__tag btn2" onclick="toggleSelected2(this)">Starbucks</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="filter__row filter__footer">
                            <button class="btn btn--text filter__cancel js-toggle" toggle-target="#home-filter">Hủy</button>
                            <button class="btn btn--primary filter__submit js-toggle" toggle-target="#home-filter">Xem kết quả</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="row row-cols-4 row-cols-lg-2 row-cols-sm-1 g-3" id="products-container"></div>
    </section>
</div>

<footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<script th:src="@{/assets/js/cart-api.js}"></script>
<script th:src="@{/assets/js/wishlist-api.js}"></script>
<script th:src="@{/assets/js/reviews-api.js}"></script>
<script th:src="@{/assets/js/address-api.js}"></script>

<script>
    function toggleSelected1(button) {
        document.querySelectorAll(".form__tags button.btn1").forEach((btn) => btn.classList.remove("selected"));
        button.classList.add("selected");
    }

    function toggleSelected2(button) {
        document.querySelectorAll(".form__tags button.btn2").forEach((btn) => btn.classList.remove("selected"));
        button.classList.add("selected");
    }

    function formatVNDFilter(value) {
        return new Intl.NumberFormat('vi-VN').format(value * 1000) + 'đ';
    }

    function updatePrice() {
        let minPrice = document.getElementById("min-price");
        let maxPrice = document.getElementById("max-price");
        let minValue = parseInt(minPrice.value);
        let maxValue = parseInt(maxPrice.value);

        if (minValue > maxValue - 100) {
            minPrice.value = maxValue - 100;
        }
        if (maxValue < minValue + 100) {
            maxPrice.value = minValue + 100;
        }

        document.getElementById("min-price-value").innerText = formatVNDFilter(minPrice.value);
        document.getElementById("max-price-value").innerText = formatVNDFilter(maxPrice.value);

        let track = document.querySelector(".slider-track");
        let minPercent = (minValue / 5000) * 100;
        let maxPercent = (maxValue / 5000) * 100;
        track.style.left = minPercent + "%";
        track.style.width = (maxPercent - minPercent) + "%";
    }

    window.onload = updatePrice;
</script>
</body>
</html>
