# ============================================
# GOOGLE CLOUD BUILD CONFIGURATION
# ============================================
# File này định nghĩa CI/CD pipeline cho Google Cloud Build
# Dùng cho Cloud Run deployment

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:latest'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fat-c-grocery-store'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'  # Singapore - gần Việt Nam
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'

images:
  - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/fat-c-grocery-store:latest'

options:
  logging: CLOUD_LOGGING_ONLY
